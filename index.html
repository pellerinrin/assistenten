<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistenten</title>
<meta name="description" content="Din stillsamma sekreterare — morgonbrief, bevakningar och koll på vardagen.">
<meta name="theme-color" content="#f7f3ea">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Assistenten">
<style>
:root{
  --paper:#f7f3ea; --card:#fffdf7; --ink:#2e2a24; --ink-soft:#6f675c; --ink-dim:#9a9084;
  --line:#e4dccb; --line-soft:#eee7d8;
  --green:#37503f; --bronze:#a8834b; --terra:#b56c4e; --blue:#6b7fa3; --red:#a03d2e;
  --shadow:0 1px 3px rgba(60,50,30,.07);
}
*{box-sizing:border-box; margin:0; padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--paper); color:var(--ink); font-size:15.5px; line-height:1.5;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif; font-weight:600}
button{font-family:inherit}

/* ---- topp ---- */
.top{
  max-width:560px; margin:0 auto; padding:20px 18px 6px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
}
.top h1{font-size:24px; letter-spacing:.02em}
.top h1 .penna{font-size:19px; margin-left:2px}
.topdate{color:var(--ink-soft); font-size:13.5px; font-style:italic; font-family:Georgia,serif}
.refresh{
  border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
  width:38px; height:38px; border-radius:50%; font-size:17px; cursor:pointer; flex:none;
}
.refresh:active{transform:rotate(180deg); transition:transform .3s}
.refresh.snurr{animation:snurr 1s linear infinite}
@keyframes snurr{to{transform:rotate(360deg)}}

main{max-width:560px; margin:0 auto; padding:10px 14px 24px}
.view{display:none}
.view.open{display:block}

/* ---- kort ---- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:16px 16px 14px; margin-bottom:14px; box-shadow:var(--shadow);
}
.card h2{font-size:16.5px; margin-bottom:8px}
.small{font-size:13.5px}
.muted{color:var(--ink-soft)}
.dim{color:var(--ink-dim)}
.center{text-align:center}
.mono{font-variant-numeric:tabular-nums}

/* ---- brief ---- */
.brief{border-color:#d8cba9; background:linear-gradient(180deg,#fffdf5,#fbf6e8)}
.brief .halsning{
  font-family:Georgia,serif; font-size:16.5px; font-style:italic; color:var(--ink);
  margin:2px 0 12px; line-height:1.55;
}
.brief-punkt{display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--line-soft)}
.brief-punkt .bp-emoji{flex:none; font-size:17px; line-height:1.4}
.brief-punkt .bp-rubrik{font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:1px}
.brief-punkt.klar{opacity:.5}
.brief-punkt.klar .bp-rubrik,.brief-punkt.klar .small{text-decoration:line-through}
.bp-atgarder{display:flex; align-items:center; gap:6px; margin-top:7px; flex-wrap:wrap}
.bp-atgarder input[type=number]{width:48px; padding:5px 6px; font-size:13px; text-align:center}
.bp-atgarder input[type=text]{flex:1 1 100%; padding:6px 8px; font-size:13px}
.bp-atgarder span{font-size:12.5px; color:var(--ink-dim)}
.brief-sign{margin-top:12px; text-align:right; font-family:Georgia,serif; font-style:italic; color:var(--ink-dim); font-size:13.5px}

/* ---- rader ---- */
.rad{display:flex; gap:10px; align-items:baseline; padding:8px 0; border-top:1px solid var(--line-soft); font-size:14.5px}
.rad:first-of-type{border-top:none}
.rad .r-emoji{flex:none; width:24px; text-align:center}
.rad .r-text{flex:1}
.rad .r-nar{flex:none; font-size:12.5px; color:var(--ink-dim); font-style:italic}
.rad .r-nar.sen{color:var(--red); font-weight:600; font-style:normal}
.rad .r-nar.idag{color:var(--green); font-weight:600; font-style:normal}

/* ---- bevakningar ---- */
.omr-rubrik{display:flex; align-items:center; gap:8px; margin:4px 0 6px}
.omr-rubrik .streck{flex:1; height:1px; background:var(--line)}
.omr-rubrik h3{font-size:14px; letter-spacing:.05em; color:var(--ink-soft); text-transform:uppercase; font-weight:600}
.post{display:flex; gap:10px; align-items:flex-start; padding:9px 2px; border-top:1px solid var(--line-soft)}
.post:first-of-type{border-top:none}
.post input[type=checkbox]{width:19px; height:19px; margin-top:2px; accent-color:var(--green); flex:none}
.post .p-text{flex:1}
.post .p-datum{font-size:12.5px; color:var(--ink-dim); font-style:italic}
.post .p-datum.sen{color:var(--red); font-weight:600; font-style:normal}
.post.klar .p-text{text-decoration:line-through; color:var(--ink-dim)}
.post .p-bort{border:none; background:none; color:var(--ink-dim); font-size:15px; cursor:pointer; padding:2px 6px}
.post .p-bort:hover{color:var(--red)}

.ny-form{display:flex; flex-direction:column; gap:8px}
.ny-form input[type=text]{width:100%}
.ny-rad2{display:flex; gap:8px; flex-wrap:wrap}
input[type=text],input[type=date],input[type=number],select,textarea{
  border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:15px;
  background:#fff; color:var(--ink); font-family:inherit;
}
textarea{width:100%; min-height:200px; line-height:1.55; resize:vertical}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--bronze)}
.ny-rad2 select{flex:1; min-width:130px}

/* ---- intervju: svarsalternativ ---- */
.alternativ{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.alternativ button{
  border:1px solid var(--line); background:#fff; color:var(--ink);
  border-radius:999px; padding:7px 14px; font-size:13.5px; cursor:pointer;
}
.alternativ button.vald{border-color:var(--green); background:var(--green); color:#fff}

/* ---- mejl ---- */
.mejl-item{padding:10px 0; border-top:1px solid var(--line-soft)}
.mejl-item:first-of-type{border-top:none}
.mejl-item .m-amne{font-weight:600}
.mejl-item .m-fran{font-size:12.5px; color:var(--ink-dim)}
.mejl-item .m-sammanfattning{font-size:14px; color:var(--ink-soft); margin-top:2px}

/* ---- ekonomi ---- */
.eko-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px}
.eko-summa{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 11px; box-shadow:var(--shadow)}
.eko-summa .es-etikett{font-size:11.5px; color:var(--ink-soft); margin-bottom:2px}
.eko-summa .es-belopp{font-family:Georgia,serif; font-weight:600; font-size:15.5px; white-space:nowrap}
.card.akut{background:var(--terra); border-color:var(--terra); color:#fff}
.card.akut h2{color:#fff}
.eko-post{display:flex; gap:10px; align-items:center; padding:9px 2px; border-top:1px solid var(--line-soft)}
.eko-post:first-of-type{border-top:none}
.eko-post .ep-text{flex:1; min-width:0; font-size:14.5px}
.eko-post .ep-belopp{font-family:Georgia,serif; font-weight:600; white-space:nowrap; font-size:14.5px}
.eko-post .ep-klar{border:1px solid var(--green); background:none; color:var(--green); border-radius:8px; width:30px; height:30px; cursor:pointer; flex:none; font-size:15px}
.typvalj{display:flex; gap:8px}
.typvalj button{flex:1; border-radius:10px; padding:8px; font-size:14px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink-soft)}
.typvalj button.vald-in{border-color:var(--blue); background:var(--blue); color:#fff}
.typvalj button.vald-ut{border-color:var(--terra); background:var(--terra); color:#fff}
.ep-bilaga{border:1px solid var(--line); background:#fff; color:var(--ink-soft); border-radius:8px; width:30px; height:30px; cursor:pointer; flex:none; font-size:14px}
.eko-post.arkiv .ep-text{color:var(--ink-dim)}
.eko-post.arkiv .ep-belopp{color:var(--ink-dim) !important}
.bild-overlay{position:fixed; inset:0; background:rgba(46,42,36,.85); z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px}
.bild-overlay img{max-width:96vw; max-height:80vh; border-radius:10px; background:#fff}
.bild-overlay .namn{color:#f7f3ea; font-size:13px; margin-top:10px}
.chatt{display:flex; flex-direction:column; gap:8px; max-height:320px; overflow-y:auto; padding:4px 0; margin:8px 0}
.bubbla{max-width:82%; border-radius:12px; padding:8px 12px; font-size:14.5px; line-height:1.45}
.bubbla.jag{align-self:flex-end; background:var(--green); color:#fdfbf4}
.bubbla.ass{align-self:flex-start; background:var(--paper); border:1px solid var(--line)}
.bubbla img{display:block; max-width:100%; max-height:180px; border-radius:8px; margin-bottom:6px; cursor:pointer}
.chatt-form{display:flex; gap:8px}
.chatt-form input{flex:1; min-width:0}
.chatt-bifogade{display:flex; flex-direction:column; gap:4px; margin-bottom:6px}
.chatt-bifogad{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:6px 10px}
.chatt-bifogad img{width:32px; height:32px; object-fit:cover; border-radius:6px; flex:none}
.chatt-bifogad button{border:none; background:none; cursor:pointer; font-size:14px; color:var(--ink-dim); margin-left:auto; flex:none}
.mik{
  border:1px solid var(--line); background:#fff; color:var(--ink); width:44px; flex:none;
  border-radius:11px; font-size:17px; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; min-height:44px;
}
.mik.lyssnar{border-color:var(--red); background:var(--red); color:#fff; animation:puls 1.2s ease-in-out infinite}
@keyframes puls{50%{opacity:.55}}
.las-upp{border:none; background:none; cursor:pointer; font-size:13px; padding:0 2px; opacity:.7}
.las-upp:hover{opacity:1}

/* ---- hälsa ---- */
.halsa-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px}
.halsa-tal{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 11px; box-shadow:var(--shadow)}
.halsa-tal .ht-etikett{font-size:11.5px; color:var(--ink-soft); margin-bottom:2px}
.halsa-tal .ht-varde{font-family:Georgia,serif; font-weight:600; font-size:15.5px; white-space:nowrap}
.halsa-tal .ht-under{font-size:11.5px; color:var(--ink-dim); margin-top:1px}
.pass{display:flex; gap:10px; align-items:center; padding:9px 2px; border-top:1px solid var(--line-soft)}
.pass:first-of-type{border-top:none}
.pass .pa-text{flex:1; min-width:0; font-size:14.5px}
.pass .pa-dag{font-size:12.5px; color:var(--ink-dim); font-style:italic}
.pass.gjort .pa-text{color:var(--ink-dim)}
.pass .pa-gor{border:1px solid var(--green); background:none; color:var(--green); border-radius:8px; width:30px; height:30px; cursor:pointer; flex:none; font-size:15px}
.pass .pa-gor.klar{background:var(--green); color:#fdfbf4}
.dagvalj{display:flex; gap:5px; flex-wrap:wrap}
.dagvalj button{
  border:1px solid var(--line); background:#fff; color:var(--ink-soft);
  border-radius:9px; padding:7px 0; font-size:13px; cursor:pointer; flex:1; min-width:38px;
}
.dagvalj button.vald{border-color:var(--green); background:var(--green); color:#fdfbf4}
.snabbrad{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px}
.snabbrad input[type=number]{width:92px}
.graf{width:100%; height:96px; display:block; margin:6px 0 2px; overflow:visible}
.graf .linje{fill:none; stroke:var(--green); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.graf .mal{stroke:var(--bronze); stroke-width:1; stroke-dasharray:3 3}
.graf .punkt{fill:var(--green)}
.graf text{font-size:9px; fill:var(--ink-dim); font-family:inherit}
.alk-rutnat{display:grid; grid-template-columns:repeat(14,1fr); gap:4px; margin:8px 0 4px}
.alk-dag{aspect-ratio:1; border-radius:5px; border:1px solid var(--line); background:#fff}
.alk-dag.fri{background:#e5ece3; border-color:#c9d8c6}
.alk-dag.latt{background:#e8d9be; border-color:#d9c39b}
.alk-dag.mycket{background:var(--terra); border-color:var(--terra)}
.alk-dag.idag{box-shadow:0 0 0 2px var(--bronze)}
.streck-lista{display:flex; flex-direction:column}

/* ---- knappar ---- */
.btn{
  border:1px solid var(--green); background:var(--green); color:#fdfbf4;
  border-radius:11px; padding:9px 16px; font-size:14.5px; cursor:pointer;
}
.btn.ghost{background:transparent; color:var(--green)}
.btn.small{padding:6px 12px; font-size:13.5px}
.btn.danger{border-color:var(--red); background:transparent; color:var(--red)}
.btn:active{transform:translateY(1px)}
.knapprad{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}

.inline-form{display:flex; gap:8px; margin-top:8px}
.inline-form input{flex:1; min-width:0; text-transform:uppercase; letter-spacing:.08em}

/* ---- flikar ---- */
.tabs{
  position:fixed; bottom:0; left:0; right:0; z-index:5;
  background:var(--card); border-top:1px solid var(--line);
  display:flex; justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabs button{
  border:none; background:none; color:var(--ink-dim); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:1px;
  font-size:19px; padding:4px 9px; border-radius:10px;
}
.tabs button span{font-size:11px; letter-spacing:.02em}
.tabs button.aktiv{color:var(--green); background:#eef0e6}

/* ---- toast ---- */
#toast{
  position:fixed; left:50%; bottom:calc(86px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(8px);
  background:var(--ink); color:#f7f3ea; border-radius:12px; padding:9px 16px; font-size:14px;
  opacity:0; pointer-events:none; transition:.25s; max-width:88vw; text-align:center; z-index:9;
}
#toast.show{opacity:1; transform:translateX(-50%)}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Assistenten <span class="penna">🖋</span></h1>
    <p class="topdate" id="topDate"></p>
  </div>
  <button class="refresh" id="refreshBtn" onclick="hamta(true)" title="Hämta nytt" aria-label="Hämta nytt">↻</button>
</header>

<main>
  <div id="view-idag" class="view"></div>
  <div id="view-bevaka" class="view"></div>
  <div id="view-halsa" class="view"></div>
  <div id="view-ekonomi" class="view"></div>
  <div id="view-mejl" class="view"></div>
  <div id="view-mer" class="view"></div>
  <div id="view-intervju" class="view"></div>
</main>

<nav class="tabs">
  <button id="tab-idag" onclick="App.go('idag')">☕<span>Idag</span></button>
  <button id="tab-bevaka" onclick="App.go('bevaka')">🗒️<span>Bevaka</span></button>
  <button id="tab-halsa" onclick="App.go('halsa')">🌿<span>Hälsa</span></button>
  <button id="tab-ekonomi" onclick="App.go('ekonomi')">💰<span>Ekonomi</span></button>
  <button id="tab-mejl" onclick="App.go('mejl')">✉️<span>Mejl</span></button>
  <button id="tab-mer" onclick="App.go('mer')">⚙️<span>Mer</span></button>
</nav>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';

/* ================= Datum & småhjälp ================= */
const WDAYS = ['måndag','tisdag','onsdag','torsdag','fredag','lördag','söndag'];
const MONTHS = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseDate(s){ const p=String(s).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function todayDate(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function addDays(d,n){ const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()); t.setDate(t.getDate()+n); return t; }
function wIdx(d){ return (d.getDay()+6)%7; } /* 0 = måndag, samma som Vardagskoll */
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function humanDate(d){ return WDAYS[wIdx(d)]+' '+d.getDate()+' '+MONTHS[d.getMonth()]; }
function isoWeek(d){
  const t = addDays(d, 3 - wIdx(d));
  const jan4 = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round((t - addDays(jan4, -wIdx(jan4))) / (7*24*3600*1000));
}
/* dagar från idag till datumsträngen (negativt = passerat) */
function dagarTill(ds){ return Math.round((parseDate(ds) - todayDate()) / (24*3600*1000)); }
function narText(ds){
  const n = dagarTill(ds);
  if(n < 0) return { text: (n === -1 ? 'igår' : Math.abs(n)+' dagar sedan'), klass: 'sen' };
  if(n === 0) return { text: 'idag', klass: 'idag' };
  if(n === 1) return { text: 'imorgon', klass: '' };
  if(n < 7) return { text: 'på '+WDAYS[wIdx(parseDate(ds))], klass: '' };
  const d = parseDate(ds);
  return { text: d.getDate()+' '+MONTHS[d.getMonth()], klass: '' };
}
function formatKr(n){ return new Intl.NumberFormat('sv-SE').format(Number(n) || 0) + ' kr'; }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ================= Livsområden ================= */
const OMRADEN = {
  barn:    { namn: 'Barnen',            emoji: '🧸' },
  karriar: { namn: 'Karriär',           emoji: '✒️' },
  hushall: { namn: 'Hushåll & ekonomi', emoji: '🏡' },
  halsa:   { namn: 'Hälsa & privat',    emoji: '🌿' },
};
/* grov gissning av livsområde utifrån en brief-punkts rubrik, används
   när en snoozad briefpunkt blir en ny bevakning */
function gissaOmrade(rubrik){
  const r = String(rubrik || '').toLowerCase();
  if(r.includes('barn')) return 'barn';
  if(r.includes('karriär') || r.includes('karriar') || r.includes('skriv') || r.includes('deadline')) return 'karriar';
  if(r.includes('hälsa') || r.includes('halsa')) return 'halsa';
  return 'hushall';
}

/* ================= Konto: ett gemensamt medlemskap ================= */
/* Samma Supabase-konto som Skrivbordet — logga in med samma e-post och
   lösenord. Vardagskoll och Assistenten ligger på samma GitHub Pages-
   ursprung, så en inloggning här räcker automatiskt även där. */
const SUPABASE_URL = 'https://sqhpkzkkveqvkqmohzpc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_s02x24M_xX4MHdqcU7ncYQ_T9ctHXKZ';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null; /* null = utloggad (eller inte klar ännu) */
let authFel = '';
let authMsg = '';
function accessToken(){ return session && session.access_token; }
function authHeaders(extra){
  const h = Object.assign({ 'Content-Type': 'application/json' }, extra || {});
  if(accessToken()) h.Authorization = 'Bearer ' + accessToken();
  return h;
}

/* Hämtar en giltig token inför ett anrop. Supabase-klienten förnyar själv
   en token som håller på att gå ut, men om appen legat i bakgrunden kan
   den ändå ha hunnit bli gammal — då syns det som 401 och anropet skulle
   annars falla med ett generiskt "kom inte fram"-fel. */
async function friskToken(){
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session){ session = data.session; return data.session.access_token; }
  }catch(e){ /* faller tillbaka på det vi har */ }
  return accessToken();
}

/* Gör ett AI-anrop robust: färsk token, förnya + försök igen en gång vid
   utgången session (401), och ett återförsök vid tillfälligt serverfel /
   överbelastning. Returnerar { res, data } eller kastar vid nätverksfel. */
async function aiAnrop(payload){
  let sista = null;
  for(let forsok = 0; forsok < 2; forsok++){
    const token = await friskToken();
    const headers = { 'Content-Type': 'application/json' };
    if(token) headers.Authorization = 'Bearer ' + token;
    let res;
    try{
      res = await fetch(API, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
    }catch(e){
      if(forsok === 0){ await new Promise(r => setTimeout(r, 1200)); continue; }
      throw e;
    }
    if(res.status === 401 && forsok === 0){
      try{ await sb.auth.refreshSession(); }catch(e){}
      continue; /* försök igen med förnyad token */
    }
    if(res.status >= 500 && forsok === 0){
      await new Promise(r => setTimeout(r, 1200)); continue; /* tillfälligt serverfel — en gång till */
    }
    const data = await res.json().catch(() => null);
    return { res: res, data: data };
  }
  return sista;
}

/* Känner igen Anthropics "kreditsaldot är slut"-fel, så vi kan säga det rakt
   ut i stället för ett generiskt fel. */
function aiCreditSlut(data){
  const msg = data && (data.message || (data.error && data.error.message) || (typeof data.error === 'string' ? data.error : ''));
  return /credit balance/i.test(msg || '');
}

/* Hälsodelen växer med tiden — normalisera alltid det som lästs in (från
   localStorage eller kontot) så vyerna slipper leta efter fält som saknas
   i data sparad av en äldre version. */
function halsaNorm(h){
  const k = (h && typeof h === 'object') ? h : {};
  const mal = (k.mal && typeof k.mal === 'object') ? k.mal : {};
  return {
    schema:  Array.isArray(k.schema)  ? k.schema  : [],
    pass:    Array.isArray(k.pass)    ? k.pass    : [],
    vikt:    Array.isArray(k.vikt)    ? k.vikt    : [],
    alkohol: Array.isArray(k.alkohol) ? k.alkohol : [],
    mal: {
      vikt:      (mal.vikt === null || mal.vikt === undefined || mal.vikt === '') ? null : Number(mal.vikt),
      veckopass: Number(mal.veckopass) > 0 ? Number(mal.veckopass) : 3,
      veckoglas: Number(mal.veckoglas) >= 0 ? Number(mal.veckoglas) : 9
    }
  };
}

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){ /* börja om från tomt */ }
  state.halsa = halsaNorm(state.halsa);
}
function save(){
  try{
    /* hela historiken bor på kontot — lokalt räcker de senaste raderna */
    if(state.samtal.length > 600) state.samtal = state.samtal.slice(-600);
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  }
  catch(e){ toast('⚠️ Kunde inte spara lokalt'); }
}

/* ================= Hämta & skicka ================= */
let hamtaLast = 0;

async function hamta(force){
  if(!session){ renderAll(); return; }
  const now = Date.now();
  if(!force && now - hamtaLast < 3 * 60 * 1000) return;
  hamtaLast = now;
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('snurr');
  try{
    /* osparade bevakningar/ekonomiposter/samtal åker upp först, så inget skrivs över */
    if(state.posterDirty) await pushPoster();
    if(state.ekonomiDirty) await pushEkonomi();
    if(state.halsaDirty) await pushHalsa();
    if(state.briefDirty) await pushBrief();
    if(state.utkorg.length) await pushLogg();
    const token = await friskToken();
    let res = await fetch(API, { headers: token ? { Authorization: 'Bearer ' + token } : {} });
    if(res.status === 401){
      /* token kan ha hunnit gå ut — förnya och försök en gång till */
      try{ await sb.auth.refreshSession(); }catch(e){}
      const t2 = await friskToken();
      res = await fetch(API, { headers: t2 ? { Authorization: 'Bearer ' + t2 } : {} });
    }
    if(res.status === 401){
      toast('⚠️ Du är utloggad — logga in igen på Idag-fliken');
      return;
    }
    if(!res.ok) throw new Error('http ' + res.status);
    state.data = await res.json() || {};
    state.dataTid = Date.now();
    if(!state.posterDirty) state.poster = Array.isArray(state.data.poster) ? state.data.poster : [];
    if(!state.ekonomiDirty){
      state.ekonomiPoster = Array.isArray(state.data.ekonomiPoster) ? state.data.ekonomiPoster : [];
      state.ekonomiSaldon = Array.isArray(state.data.ekonomiSaldon) ? state.data.ekonomiSaldon : [];
    }
    if(Array.isArray(state.data.samtal)){
      state.samtal = state.data.samtal;
      delete state.data.samtal; /* ligger i state.samtal — ingen dubbellagring */
    }
    /* hälsan skrivs bara här i appen: kontot vinner när det har något att
       säga, men ett tomt svar (t.ex. en server som ännu inte känner till
       nyckeln) får aldrig radera det som ligger i telefonen */
    if(!state.halsaDirty && state.data.halsa && typeof state.data.halsa === 'object'){
      state.halsa = halsaNorm(state.data.halsa);
    }
    delete state.data.halsa;
    save();
    renderAll();
    checkNotiser();
  }catch(e){
    /* offline eller serverfel: senast hämtade datat visas vidare */
    if(force) toast('Kunde inte nå kontoret just nu – visar det senaste jag vet');
  }finally{
    btn.classList.remove('snurr');
  }
}

/* ---- samtalsloggen: allt som sägs mellan Anna och assistenten sparas på
   kontot och försvinner aldrig (utom när Anna själv raderar det under Mer).
   Nya rader väntar i utkorgen tills servern kvitterat dem, så inget tappas
   även om nätet strular mitt i ett samtal. ---- */
let loggTimer = null;
function loggaMeddelande(kanal, roll, text){
  const id = 'm' + Date.now() + Math.random().toString(36).slice(2, 7);
  state.utkorg.push({
    id: id,
    t: new Date().toISOString(),
    roll: roll,
    kanal: kanal,
    text: String(text)
  });
  save();
  clearTimeout(loggTimer);
  loggTimer = setTimeout(pushLogg, 800);
  return id;
}
function kanalMeddelanden(kanal){
  return state.samtal.filter(m => m.kanal === kanal)
    .concat(state.utkorg.filter(m => m.kanal === kanal))
    .sort((a, b) => String(a.t).localeCompare(String(b.t)));
}
async function pushLogg(){
  if(!session || !state.utkorg.length) return;
  const batch = state.utkorg.slice(0, 100);
  try{
    const res = await fetch(API, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ logga: batch })
    });
    if(!res.ok) throw new Error('http ' + res.status);
    const data = await res.json().catch(() => null);
    const sparade = new Set((data && data.sparade) || batch.map(m => m.id));
    state.samtal = state.samtal.concat(state.utkorg.filter(m => sparade.has(m.id)));
    state.utkorg = state.utkorg.filter(m => !sparade.has(m.id));
    save();
    if(state.utkorg.length){ clearTimeout(loggTimer); loggTimer = setTimeout(pushLogg, 800); }
  }catch(e){
    /* raderna ligger kvar i utkorgen och skickas om vid nästa försök */
  }
}

/* ================= Notiser (medan appen är öppen) ================= */
function notiserPa(){ return ('Notification' in window) && Notification.permission === 'granted'; }
function fireNotis(title, body, key){
  try{ new Notification(title, { body: body, icon: 'icon-192.png', tag: key }); }catch(e){}
}
function checkNotiser(){
  if(!notiserPa()) return;
  const ts = fmtDate(todayDate());
  let changed = false;
  function once(key, fn){
    if(state.notified[key]) return;
    fn();
    state.notified[key] = ts;
    changed = true;
  }
  /* morgonbriefen har kommit */
  const b = state.data.brief;
  if(b && b.datum === ts) once('b-' + b.datum, () =>
    fireNotis('Assistenten ☕', 'Morgonbriefen är klar – slå dig ner en stund.', 'b-' + b.datum));
  /* dagens träningspass, om det ännu inte är avbockat */
  const kvarIdag = schemaForDag(wIdx(todayDate())).filter(s => !schemapassGjort(s.id, ts));
  if(kvarIdag.length) once('t-' + ts, () =>
    fireNotis('Assistenten 🌿', 'Träning idag: ' + kvarIdag.map(s => s.namn).join(', '), 't-' + ts));
  /* bevakningar med datum: imorgon och på dagen */
  for(const p of state.poster){
    if(p.klar || !p.datum) continue;
    const n = dagarTill(p.datum);
    if(n === 1) once('p-' + p.id + '-1', () => fireNotis('Assistenten 🗒️', 'Imorgon: ' + p.text, 'p-' + p.id));
    if(n === 0) once('p-' + p.id + '-0', () => fireNotis('Assistenten 🗒️', 'Idag: ' + p.text, 'p-' + p.id));
  }
  /* ekonomiposter som förfaller imorgon eller idag */
  for(const p of state.ekonomiPoster){
    if(!p.forfallodatum) continue;
    const n = dagarTill(p.forfallodatum);
    const vad = (p.typ === 'in' ? 'Fakturera ' : 'Betala ') + p.beskrivning + ' (' + formatKr(p.belopp) + ')';
    if(n === 1) once('e-' + p.id + '-1', () => fireNotis('Assistenten 💰', 'Imorgon: ' + vad, 'e-' + p.id));
    if(n === 0) once('e-' + p.id + '-0', () => fireNotis('Assistenten 💰', 'Idag: ' + vad, 'e-' + p.id));
  }
  /* datum som assistenten hittat i mejlen */
  const fynd = (state.data.mejl && state.data.mejl.datumfynd) || [];
  for(const f of fynd){
    if(!f.datum) continue;
    const n = dagarTill(f.datum);
    if(n === 1) once('d-' + f.datum + '-' + String(f.text).slice(0, 24), () =>
      fireNotis('Assistenten ✉️', 'Imorgon: ' + f.text, 'd-' + f.datum));
  }
  /* städa gamla nycklar */
  const limit = fmtDate(addDays(todayDate(), -14));
  for(const k of Object.keys(state.notified)){
    if(state.notified[k] < limit){ delete state.notified[k]; changed = true; }
  }
  if(changed) save();
}

    }
    const middag = vk.middagar && vk.middagar[ts];
    if(middag) lage += radHtml('🍲', 'Middag: ' + esc((middag.emoji ? middag.emoji + ' ' : '') + (middag.name || '')));
    const stadIdag = (vk.stad || []).filter(s => s.dag === wIdx(t));
    if(stadIdag.length) lage += radHtml('🧹', 'Städ idag: ' + esc(stadIdag.map(s => s.namn).join(', ')));
    if(vk.inkopKvar > 0) lage += radHtml('🛒', vk.inkopKvar + (vk.inkopKvar === 1 ? ' sak' : ' saker') + ' på inköpslistan');
  }
  const resor = Array.isArray(d.jobbresor) ? d.jobbresor : [];
  const paResa = resor.find(r => r.start <= ts && ts <= (r.end || r.start));
  if(paResa){
    lage += radHtml('🧳', 'Jobbresa: ' + esc(paResa.label || 'Jobbresa'), narText(paResa.end || paResa.start).text === 'idag' ? { text: 'sista dagen', klass: '' } : { text: 'till ' + narText(paResa.end).text, klass: '' });
  } else {
    const nasta = resor.filter(r => r.start > ts).sort((a,b) => a.start.localeCompare(b.start))[0];
    if(nasta && dagarTill(nasta.start) <= 14) lage += radHtml('🧳', 'Nästa jobbresa: ' + esc(nasta.label || 'Jobbresa'), narText(nasta.start));
  }
  /* hälsan: dagens träningspass och en påminnelse om vägningen */
  const dagensPass = schemaForDag(wIdx(t));
  const kvarIdag = dagensPass.filter(s => !schemapassGjort(s.id, ts));
  if(kvarIdag.length){
    lage += radHtml(passEmoji(kvarIdag[0].typ), 'Träning idag: ' + esc(kvarIdag.map(s => s.namn).join(', ')) +
      ' <span class="dim">(bocka av under Hälsa)</span>');
  } else if(passForDatum(ts).length){
    lage += radHtml('🌿', 'Dagens träning är avklarad — ' +
      passIVeckan(t).length + ' av ' + state.halsa.mal.veckopass + ' pass den här veckan');
  }
  const sistaVikt = viktSenaste();
  if(sistaVikt && dagarTill(sistaVikt.datum) <= -7){
    lage += radHtml('⚖️', Math.abs(dagarTill(sistaVikt.datum)) + ' dagar sedan du vägde dig sist');
  }

  const sb = d.skrivbordet || {};
  if(sb.deadline){
    const n = dagarTill(sb.deadline);
    if(n >= 0) lage += radHtml('✒️', 'Skrivdeadline', narText(sb.deadline));
    else lage += radHtml('✒️', 'Skrivdeadline passerad', narText(sb.deadline));
  }
  if(lage){
    html += '<div class="card"><h2>Läget idag</h2>' + lage + '</div>';
  } else {
    html += '<div class="card"><h2>Läget idag</h2><p class="small muted">Inget särskilt att rapportera. ' +
      (vk ? '' : 'Logga in i Vardagskoll också (samma konto) så ser jag barnens schema.') + '</p></div>';
  }

  /* ---- att hålla ögonen på ---- */
  const bevakning = [];
  for(const p of state.poster){
    if(p.klar || !p.datum) continue;
    if(dagarTill(p.datum) <= 10) bevakning.push({ datum: p.datum, emoji: OMRADEN[p.omrade] ? OMRADEN[p.omrade].emoji : '🗒️', text: esc(p.text) });
  }
  for(const f of ((d.mejl && d.mejl.datumfynd) || [])){
    if(!f.datum || dagarTill(f.datum) < 0 || dagarTill(f.datum) > 14) continue;
    bevakning.push({ datum: f.datum, emoji: '✉️', text: esc(f.text) });
  }
  for(const p of ekoAktiva()){
    if(!p.forfallodatum || dagarTill(p.forfallodatum) > 10) continue;
    bevakning.push({ datum: p.forfallodatum, emoji: '💰',
      text: esc((p.typ === 'in' ? 'Fakturera: ' : 'Betala: ') + p.beskrivning + ' — ' + formatKr(p.belopp)) });
  }
  bevakning.sort((a,b) => a.datum.localeCompare(b.datum));
  if(bevakning.length){
    html += '<div class="card"><h2>Att hålla ögonen på</h2>';
    for(const r of bevakning) html += radHtml(r.emoji, r.text, narText(r.datum));
    html += '</div>';
  }

  document.getElementById('view-idag').innerHTML = html;
  briefRenderadFor = briefNu;

  /* återställ chattens läge efter omritningen */
  const nyInput = document.getElementById('prataInput');
  if(nyInput && inTxt) nyInput.value = inTxt;
  if(nyInput && hadeFokus) nyInput.focus();
  /* …och briefpunkternas fält (en punkt som just bockats av har inget fält
     längre — då finns id:t inte kvar och hoppas tyst över). Även TOMMA
     värden återställs — annars smyger dagar-fältets förvalda "3" tillbaka
     mitt i skrivandet när en bakgrundsomritning råkar landa. */
  for(const id of Object.keys(briefFalt)){
    const falt = document.getElementById(id);
    if(falt) falt.value = briefFalt[id];
  }
  if(briefFokusId){
    const falt = document.getElementById(briefFokusId);
    if(falt) falt.focus();
  }
  const pc = document.getElementById('prataChatt');
  if(pc) pc.scrollTop = pc.scrollHeight;
  const mik = document.getElementById('prataMik');
  if(mik) mik.classList.toggle('lyssnar', rostAktiv);
}

function renderBevaka(){
  let html = '<div class="card"><h2>Ny bevakning</h2>' +
    '<div class="ny-form">' +
    '<input type="text" id="nyText" placeholder="t.ex. Boka tandläkartid till barnen" onkeydown="if(event.key===\'Enter\')App.nyPost()">' +
    '<div class="ny-rad2">' +
    '<select id="nyOmrade">' +
    Object.keys(OMRADEN).map(k => '<option value="' + k + '">' + OMRADEN[k].emoji + ' ' + OMRADEN[k].namn + '</option>').join('') +
    '</select>' +
    '<input type="date" id="nyDatum" title="Datum (valfritt)">' +
    '<button class="btn" onclick="App.nyPost()">Lägg till</button>' +
    '</div></div></div>';

  /* bevakningar långt fram i tiden ligger och skvalpar annars i varje
     områdeslista — de döljs tills det närmar sig (FRAMTID_DAGAR), och
     dyker sedan upp av sig själva nästa gång listan ritas om */
  const FRAMTID_DAGAR = 14;
  const allaOppna = state.poster.filter(p => !p.klar);
  const oppna = allaOppna.filter(p => !p.datum || dagarTill(p.datum) <= FRAMTID_DAGAR);
  const framtida = allaOppna.filter(p => p.datum && dagarTill(p.datum) > FRAMTID_DAGAR)
    .sort((a,b) => a.datum.localeCompare(b.datum));
  const klara = state.poster.filter(p => p.klar);

  for(const k of Object.keys(OMRADEN)){
    const lista = oppna.filter(p => p.omrade === k)
      .sort((a,b) => (a.datum || '9999').localeCompare(b.datum || '9999'));
    if(!lista.length) continue;
    html += '<div class="omr-rubrik"><h3>' + OMRADEN[k].emoji + ' ' + OMRADEN[k].namn + '</h3><div class="streck"></div></div>';
    html += '<div class="card" style="padding-top:8px;padding-bottom:8px">';
    for(const p of lista){
      const nar = p.datum ? narText(p.datum) : null;
      html += '<div class="post">' +
        '<input type="checkbox" onchange="App.togglePost(\'' + p.id + '\')">' +
        '<div class="p-text">' + esc(p.text) +
        (nar ? '<div class="p-datum ' + nar.klass + '">' + esc(cap(nar.text)) + '</div>' : '') +
        '</div>' +
        '<button class="p-bort" title="Ta bort" onclick="App.bortPost(\'' + p.id + '\')">✕</button>' +
        '</div>';
    }
    html += '</div>';
  }

  if(!oppna.length && !framtida.length){
    html += '<div class="card center"><p class="small muted">Inga öppna bevakningar — skrivbordet är rent. 🕊️</p></div>';
  }

  if(framtida.length){
    html += '<div class="card" style="padding-top:10px;padding-bottom:10px">' +
      '<p class="small muted" style="cursor:pointer" onclick="App.toggleFramtid()">' +
      (state.visaFramtid ? '▾' : '▸') + ' ' + framtida.length + ' kommande längre fram</p>';
    if(state.visaFramtid){
      for(const p of framtida){
        const nar = narText(p.datum);
        html += '<div class="post">' +
          '<input type="checkbox" onchange="App.togglePost(\'' + p.id + '\')">' +
          '<div class="p-text">' + (OMRADEN[p.omrade] ? OMRADEN[p.omrade].emoji + ' ' : '') + esc(p.text) +
          '<div class="p-datum ' + nar.klass + '">' + esc(cap(nar.text)) + '</div>' +
          '</div>' +
          '<button class="p-bort" title="Ta bort" onclick="App.bortPost(\'' + p.id + '\')">✕</button>' +
          '</div>';
      }
    }
    html += '</div>';
  }

  if(klara.length){
    html += '<div class="card" style="padding-top:10px;padding-bottom:10px">' +
      '<p class="small muted" style="cursor:pointer" onclick="App.toggleKlara()">' +
      (state.visaKlara ? '▾' : '▸') + ' ' + klara.length + ' avklarade</p>';
    if(state.visaKlara){
      for(const p of klara.slice(-20).reverse()){
        html += '<div class="post klar">' +
          '<input type="checkbox" checked onchange="App.togglePost(\'' + p.id + '\')">' +
          '<div class="p-text">' + esc(p.text) + '</div>' +
          '<button class="p-bort" title="Ta bort" onclick="App.bortPost(\'' + p.id + '\')">✕</button>' +
          '</div>';
      }
      html += '<div class="knapprad"><button class="btn small ghost" onclick="App.rensaKlara()">Rensa avklarade</button></div>';
    }
    html += '</div>';
  }

  document.getElementById('view-bevaka').innerHTML = html;
}

/* bifogade bilder/PDF:er som väntar på att skickas (en lista — flera filer
   kan följa med samma meddelande), samt bildförhandsvisningar till redan
   skickade meddelanden ({meddelandeId: [dataUrl, ...]}) — bara i minnet,
   sparas aldrig till servern eller localStorage (jfr fakturabilagor: bilden
   är tillfällig, det som sägs om den sparas för alltid i samtalsloggen) */
let prataBifogade = [];

/* länkar Anna klistrar in i chatten läses av via r.jina.ai (samma
   läsartjänst som Skrivbordets egen länkanalys i App.jsx) — en gratis
   proxy som hämtar och renderar sidan åt oss, så inga CORS- eller
   JS-rendering-problem, och ingen egen serverkod behövs. */
const LANK_REGEX = /https?:\/\/[^\s<>"']+/g;
function kortAdress(url){
  try{ return new URL(url).hostname.replace(/^www\./, ''); }catch(e){ return 'sidan'; }
}
async function hamtaLankText(url){
  try{
    const r = await fetch('https://r.jina.ai/' + url);
    if(r.ok){
      const t = (await r.text()).trim();
      if(t.length >= 200) return t.slice(0, 6000);
    }
  }catch(e){}
  return null;
}
let rostAktiv = false;
let rostIgang = null;

/* svensk röst för uppläsning (listan laddas ibland i efterhand) */
let rostSv = null;
function valjRost(){
  const alla = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  rostSv = alla.find(v => v.lang === 'sv-SE') || alla.find(v => String(v.lang || '').toLowerCase().startsWith('sv')) || null;
}
if(KAN_TALA){
  valjRost();
  speechSynthesis.onvoiceschanged = valjRost;
}
function talUpp(text){
  if(!KAN_TALA || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'sv-SE';
    if(!rostSv) valjRost();
    if(rostSv) u.voice = rostSv;
    speechSynthesis.speak(u);
  }catch(e){ /* uppläsning är grädde på moset — aldrig ett fel värt att visa */ }
}

    '- Är något oklart: ställ en kort följdfråga i "svar" i stället för att ändra något.\n' +
    '- Gissa aldrig om sådant som inte finns i underlaget eller går att slå upp — säg hellre att du inte vet.';
}

/* webbsökning körs som ett eget AI-anrop med Anthropics web_search-verktyg
   (serverns ai.web-väg) — det kan inte ligga i samma anrop som verktygs-
   lådan eftersom tool_choice "any"/"tool" inte kan kombineras fritt med
   serversökverktyget. Resultatet blir en kompakt textsammanfattning. */
async function webbSok(fraga){
  try{
    const { res, data } = await aiAnrop({ ai: {
      web: true,
      max_tokens: 2500,
      system: 'Du är en sökassistent. Sök på webben och svara med en kompakt, saklig sammanfattning av vad du hittar (med källor och datum när det finns). Idag är ' + fmtDate(todayDate()) + '. Svara på svenska.',
      messages: [{ role: 'user', content: String(fraga || '') }]
    } });
    if(res && res.ok && data && data.text) return String(data.text).slice(0, 6000);
  }catch(e){}
  return 'Sökningen gick inte att genomföra just nu.';
}

/* ================= Hälsa ================= */
/* Tre saker på ett ställe: ett återkommande träningsschema (veckodagar) med
   avbockning per dag, vikten över tid och alkoholen dag för dag. Allt bor i
   state.halsa och synkas till kontot under nyckeln assistent-halsa. */
const PASSTYPER = {
  styrka:    { namn: 'Styrka',            emoji: '🏋️' },
  kondition: { namn: 'Kondition',         emoji: '🏃' },
  promenad:  { namn: 'Promenad',          emoji: '🚶' },
  rorlighet: { namn: 'Yoga & rörlighet',  emoji: '🧘' },
  annat:     { namn: 'Annat',             emoji: '🌿' },
};
function passEmoji(typ){ return (PASSTYPER[typ] || PASSTYPER.annat).emoji; }

let halsaForm = { passOpen: false, schemaOpen: false, schemaDag: null, visaAllVikt: false, visaAllAlk: false };

/* ---- träningen ---- */
function veckoStart(d){ return addDays(d, -wIdx(d)); }
function schemaForDag(dag){ return state.halsa.schema.filter(s => s.dag === dag); }
function passForDatum(ds){ return state.halsa.pass.filter(p => p.datum === ds); }
/* har ett visst schemalagt pass bockats av en viss dag? */
function schemapassGjort(schemaId, ds){
  return state.halsa.pass.find(p => p.datum === ds && p.schemaId === schemaId) || null;
}
function passIVeckan(d){
  const start = fmtDate(veckoStart(d)), slut = fmtDate(addDays(veckoStart(d), 6));
  return state.halsa.pass.filter(p => p.datum >= start && p.datum <= slut);
}
/* ---- vikten ---- */
function viktSorterad(){ return state.halsa.vikt.slice().sort((a, b) => String(a.datum).localeCompare(String(b.datum))); }
function viktSenaste(){ const v = viktSorterad(); return v.length ? v[v.length - 1] : null; }
/* närmaste vägning på eller före ett visst datum — så "sedan 30 dagar" går
   att svara på även när det inte vägts exakt den dagen */
function viktVid(ds){
  const v = viktSorterad().filter(x => x.datum <= ds);
  return v.length ? v[v.length - 1] : null;
}
function viktForandring(dagar){
  const senaste = viktSenaste();
  if(!senaste) return null;
  const da = fmtDate(addDays(parseDate(senaste.datum), -dagar));
  const tidigare = viktVid(da);
  if(!tidigare || tidigare.datum === senaste.datum) return null;
  return { kg: Math.round((senaste.kg - tidigare.kg) * 10) / 10, fran: tidigare };
}
function fmtKg(n){ return (Math.round(Number(n) * 10) / 10).toFixed(1).replace('.', ',') + ' kg'; }
function fmtDiff(n){ return (n > 0 ? '+' : n < 0 ? '−' : '±') + fmtKg(Math.abs(n)); }

/* Enkel kurva över vikten. Ritas utan proportionsbevarande så den fyller
   bredden; linjen får non-scaling-stroke så den inte blir tjockare av
   sträckningen, och alla siffror står i HTML utanför grafen. */
function viktGraf(punkter, mal){
  if(punkter.length < 2) return '';
  const W = 300, H = 96, pad = 6;
  const xs = punkter.map(p => parseDate(p.datum).getTime());
  const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  const varden = punkter.map(p => Number(p.kg)).concat(mal ? [Number(mal)] : []);
  let minY = Math.min.apply(null, varden), maxY = Math.max.apply(null, varden);
  if(maxY - minY < 1){ const mitt = (maxY + minY) / 2; minY = mitt - 0.5; maxY = mitt + 0.5; }
  const marg = (maxY - minY) * 0.15;
  minY -= marg; maxY += marg;
  const x = (t) => maxX === minX ? W / 2 : pad + (W - 2 * pad) * (t - minX) / (maxX - minX);
  const y = (v) => pad + (H - 2 * pad) * (1 - (v - minY) / (maxY - minY));
  const linje = punkter.map(p => x(parseDate(p.datum).getTime()).toFixed(1) + ',' + y(Number(p.kg)).toFixed(1)).join(' ');
  return '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    (mal ? '<line class="mal" vector-effect="non-scaling-stroke" x1="0" x2="' + W + '" y1="' + y(Number(mal)).toFixed(1) + '" y2="' + y(Number(mal)).toFixed(1) + '"></line>' : '') +
    '<polyline class="linje" vector-effect="non-scaling-stroke" points="' + linje + '"></polyline>' +
    '</svg>';
}

/* ---- alkoholen ---- */
function alkoholForDatum(ds){
  return state.halsa.alkohol.filter(a => a.datum === ds).reduce((s, a) => s + (Number(a.glas) || 0), 0);
}
function alkoholRegistrerad(ds){ return state.halsa.alkohol.some(a => a.datum === ds); }
function alkoholIVeckan(d){
  const start = fmtDate(veckoStart(d)), slut = fmtDate(addDays(veckoStart(d), 6));
  return state.halsa.alkohol.filter(a => a.datum >= start && a.datum <= slut)
    .reduce((s, a) => s + (Number(a.glas) || 0), 0);
}
/* dagar sedan senaste glaset — tydligare än en svit som bryts av dagar
   utan registrering (många noterar bara de dagar det faktiskt blir något) */
function dagarSedanGlas(){
  const med = state.halsa.alkohol.filter(a => (Number(a.glas) || 0) > 0)
    .sort((a, b) => String(a.datum).localeCompare(String(b.datum)));
  if(!med.length) return null;
  return { dagar: dagarTill(med[med.length - 1].datum) * -1, datum: med[med.length - 1].datum };
}
function alkKlass(glas, registrerad){
  if(!registrerad) return '';
  if(glas === 0) return 'fri';
  if(glas <= 2) return 'latt';
  return 'mycket';
}

/* En kompakt sammanfattning som chatten och morgonbriefen kan läsa. */
function halsaSammanfattning(){
  const t = todayDate();
  const h = state.halsa;
  const veckansPass = passIVeckan(t);
  const v = viktSenaste();
  const f7 = viktForandring(7), f30 = viktForandring(30);
  const sedan = dagarSedanGlas();
  const rader = [];
  rader.push('Träningsschema: ' + (h.schema.length
    ? h.schema.map(s => WDAYS[s.dag] + ' ' + s.namn + (s.minuter ? ' (' + s.minuter + ' min)' : '')).join('; ')
    : 'inget upplagt'));
  rader.push('Pass denna vecka: ' + veckansPass.length + ' av målet ' + h.mal.veckopass +
    (veckansPass.length ? ' (' + veckansPass.map(p => p.namn).join(', ') + ')' : ''));
  rader.push('Vikt: ' + (v ? v.kg + ' kg (' + v.datum + ')' +
    (f7 ? ', ' + (f7.kg > 0 ? '+' : '') + f7.kg + ' kg på 7 dagar' : '') +
    (f30 ? ', ' + (f30.kg > 0 ? '+' : '') + f30.kg + ' kg på 30 dagar' : '') +
    (h.mal.vikt ? ', målvikt ' + h.mal.vikt + ' kg' : '')
    : 'ingen vägning registrerad'));
  rader.push('Alkohol: ' + alkoholIVeckan(t) + ' glas denna vecka (mål högst ' + h.mal.veckoglas + '), ' +
    (sedan ? (sedan.dagar === 0 ? 'senast idag' : sedan.dagar + ' dagar sedan senaste glaset') : 'inget registrerat ännu'));
  return rader.join('\n');
}

/* aktuella respektive avklarade poster — avklarade arkiveras för alltid,
   det är bara fakturabilden som städas bort när posten bockas av */

/* ---- fakturabilagor: bilden komprimeras i webbläsaren och sparas på
   kontot som en egen nyckel; den raderas när posten bockas av ---- */
function komprimeraBild(fil){
  return new Promise((resolve) => {
    const url = URL.createObjectURL(fil);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const forsok = [[1500, 0.8], [1500, 0.6], [1100, 0.55], [900, 0.45]];
      for(const [maxSida, kvalitet] of forsok){
        const skala = Math.min(1, maxSida / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * skala);
        c.height = Math.round(img.height * skala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const dataUrl = c.toDataURL('image/jpeg', kvalitet);
        if(dataUrl.length <= 340000){ resolve(dataUrl); return; }
      }
      resolve(null);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
async function laddaUppBilaga(postId, fil){
  const typ = fil.type || '';
  let dataUrl = null;
  if(typ.startsWith('image/')){
    dataUrl = await komprimeraBild(fil);
    if(!dataUrl){ toast('Bilden gick inte att förminska — försök fota rakare och närmare'); return false; }
  } else if(typ === 'application/pdf'){
    if(fil.size > 250000){ toast('PDF:en är för stor — fota fakturan i stället 📷'); return false; }
    dataUrl = await new Promise((res) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => res(null);
      fr.readAsDataURL(fil);
    });
    if(!dataUrl){ toast('Kunde inte läsa filen'); return false; }
  } else {
    toast('Bara bilder och PDF går att spara');
    return false;
  }
  try{
    const res = await fetch(API, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ skriv: { ['assistent-bilaga-' + postId]: {
        namn: fil.name || 'faktura', typ: typ.startsWith('image/') ? 'image/jpeg' : typ,
        data: dataUrl, uppladdad: new Date().toISOString()
      } } })
    });
    if(!res.ok) throw new Error('http ' + res.status);
    const p = state.ekonomiPoster.find(x => x.id === postId);
    if(p){ p.bilaga = true; save(); scheduleEkonomiPush(); }
    renderEkonomi();
    toast('🧾 Fakturan är sparad');
    return true;
  }catch(e){
    toast('Kunde inte spara bilden just nu — försök igen om en stund');
    return false;
  }
}
function visaBildOverlay(bilaga){
  const div = document.createElement('div');
  div.className = 'bild-overlay';
  div.onclick = () => div.remove();
  if(String(bilaga.typ).startsWith('image/')){
    const img = document.createElement('img');
    img.src = bilaga.data;
    div.appendChild(img);
  }
  const namn = document.createElement('div');
  namn.className = 'namn';
  namn.textContent = (bilaga.namn || 'bilaga') + ' — tryck för att stänga';
  div.appendChild(namn);
  document.body.appendChild(div);
}

/* Tolkar exakt ett JSON-objekt ur AI-svaret, djup/strängmedveten. */
function tolkaJSONObjekt(text){
  if(!text) return null;
  const t = String(text).replace(/```json/gi, '').replace(/```/g, '');
  let depth = 0, start = -1, inStr = false, escd = false;
  for(let i = 0; i < t.length; i++){
    const ch = t[i];
    if(inStr){
      if(escd) escd = false;
      else if(ch === '\\') escd = true;
      else if(ch === '"') inStr = false;
      continue;
    }
    if(ch === '"') inStr = true;
    else if(ch === '{'){
      if(depth === 0) start = i;
      depth++;
    } else if(ch === '}'){
      depth--;
      if(depth === 0 && start !== -1){
        try{ return JSON.parse(t.slice(start, i + 1)); }
        catch(e){ start = -1; }
      }
    }
  }
  return null;
}

/* Räddar ut "svar"-fältet ur ett AI-svar även om JSON:et klippts av i förtid
   (t.ex. när svaret blev längre än max_tokens och strängen aldrig avslutades)
   — annars försvinner ett fullt läsbart svar bara för att JSON:et inte gick
   att tolka i sin helhet. Läser tecken för tecken från "svar":" och tar med
   allt fram till avslutande citattecken, eller till slutet om det saknas. */
function raddaSvarUrText(text){
  if(!text) return null;
  const t = String(text);
  const m = t.match(/"svar"\s*:\s*"/);
  if(!m) return null;
  let out = '', escd = false;
  for(let i = m.index + m[0].length; i < t.length; i++){
    const ch = t[i];
    if(escd){
      out += ch === 'n' ? '\n' : ch === 't' ? '\t' : ch;
      escd = false;
    } else if(ch === '\\'){
      escd = true;
    } else if(ch === '"'){
      break; /* strängen slut */
    } else {
      out += ch;
    }
  }
  out = out.trim();
  return out || null;
}

/* Sista utväg: modellen svarade i klartext utan brukbart JSON. Visa den råa
   texten (utan kodstaket) hellre än ett generiskt felmeddelande — men bara
   om den inte ser ut som ett trasigt JSON-objekt (då hade räddningen ovan
   redan fångat "svar"). */
function lasbarText(text){
  const ren = String(text || '').replace(/```json/gi, '').replace(/```/g, '').trim();
  if(!ren || ren.startsWith('{') || ren.startsWith('[')) return null;
  return ren;
}

  /* Annas kommentar på en briefpunkt går genom agent-chatten så assistenten

     svarar i chatten — allt hamnar i den permanenta samtalsloggen som även
     morgonjobben läser. Är chatten upptagen loggas kommentaren direkt i
     stället, så den aldrig tappas. */
  /* returnerar 'skickad' (gick genom chatten), 'antecknad' (chatten var
     upptagen — loggad direkt) eller null (inget att skicka), så anroparen
     kan väva in beskedet i SIN toast — appen har bara ett toastfält och
     senare anrop skriver över tidigare */
  briefSkickaKommentar(i, handling){
    const falt = document.getElementById('briefKommentar' + i);
    const kommentar = ((falt && falt.value) || '').trim();
    if(!kommentar) return null;
    const b = state.data && state.data.brief;
    const p = b && b.punkter && b.punkter[i];
    const rubrik = (p && (p.rubrik || p.text)) || 'en punkt';
    const text = 'Om briefpunkten "' + rubrik + '"' + (handling ? ' (' + handling + ')' : '') + ': ' + kommentar;
    if(prataSkickar || prataLaserFiler){
      loggaMeddelande('prata', 'jag', text);
      return 'antecknad';
    }
    this.prataSkicka(false, text);
    return 'skickad';

     samma "Enter = skicka" som i alla andra fält i appen */

    if(!res) return;
    const falt = document.getElementById('briefKommentar' + i);
    if(falt) falt.value = '';
    toast(res === 'skickad'

  /* Läser av en bifogad faktura (bild/PDF) och fyller i tomma fält åt Anna.
     Ingen omritning görs — då skulle det valda fil-objektet tappas — utan
     fälten uppdateras direkt i DOM, precis som ekoTyp. */
  async ekoFilVald(input){
    const fil = input.files && input.files[0];
    if(!fil) return;
    ekoValdFil = fil; /* denna bilaga sparas när posten sparas, oavsett knapp */
    const namnEl = document.getElementById('ekoFilNamn');
    if(namnEl) namnEl.textContent = '📎 ' + (fil.name || 'fakturan');
    const setStatus = (t) => { const s = document.getElementById('ekoFilStatus'); if(s) s.textContent = t; };
    if(!session){ setStatus('Logga in först.'); return; }
    const filtyp = fil.type || '';
    setStatus('🔍 Läser av fakturan…');
    let block = null;
    try{
      if(filtyp.startsWith('image/')){
        const dataUrl = await komprimeraBild(fil);
        if(!dataUrl){ setStatus('Kunde inte läsa bilden — fyll i själv.'); return; }
        block = { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: dataUrl.split(',')[1] } };
      } else if(filtyp === 'application/pdf'){
        if(fil.size > 2500000){ setStatus('PDF:en är för stor att läsa av — fyll i själv.'); return; }
        const dataUrl = await new Promise((res) => {
          const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => res(null); fr.readAsDataURL(fil);
        });
        if(!dataUrl){ setStatus('Kunde inte läsa filen — fyll i själv.'); return; }
        block = { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: dataUrl.split(',')[1] } };
      } else {
        setStatus(''); return;
      }
      const idag = fmtDate(todayDate());
      const system = 'Du läser en svensk faktura eller räkning och plockar ut nyckeluppgifter. Idag är ' + idag + '.\n' +
        'Svara ENBART med ett JSON-objekt, ingen text runt om:\n' +
        '{"typ":"in|ut|null","beskrivning":"kort, t.ex. avsändare och fakturanummer","belopp":tal_eller_null,"forfallodatum":"ÅÅÅÅ-MM-DD eller null"}\n' +
        '"typ" = "ut" om det är en räkning användaren ska betala, "in" om det är en faktura användaren själv skickat för att få betalt, null om oklart.\n' +
        'belopp = totalbeloppet i kronor, rent tal utan mellanslag, "kr" eller tusentalsavgränsare.\n' +
        'forfallodatum = sista betaldag om det finns, annars fakturadatum. Gissa aldrig — sätt null om något inte tydligt framgår.';
      const { res, data } = await aiAnrop({ ai: { system: system, max_tokens: 2000, messages: [{ role: 'user', content: [ block, { type: 'text', text: 'Plocka ut uppgifterna ur fakturan.' } ] }] } });
      if(res.status === 401){ setStatus('Du verkar utloggad — logga in igen på Idag-fliken.'); return; }
      if(res.status === 429){ setStatus((data && data.message) || 'Dagens AI-gräns är nådd — fyll i själv.'); return; }
      if(res.status === 413){ setStatus('Filen är för stor att läsa av — fyll i själv.'); return; }
      if(aiCreditSlut(data)){ setStatus('AI-kontots kredit verkar slut — fyll i själv.'); return; }
      if(!res.ok || !data || !data.text) throw new Error('http ' + res.status);
      const r = tolkaJSONObjekt(data.text);
      if(!r){ setStatus('Kunde inte tyda fakturan — fyll i själv.'); return; }
      /* fyll bara fält som är tomma, så det Anna redan skrivit står kvar */
      const beskrEl = document.getElementById('ekoBeskr');
      const beloppEl = document.getElementById('ekoBelopp');
      const datumEl = document.getElementById('ekoDatum');
      const fyllda = [];
      if(beskrEl && !beskrEl.value.trim() && r.beskrivning){ beskrEl.value = String(r.beskrivning); fyllda.push('beskrivning'); }
      if(beloppEl && !beloppEl.value && Number(r.belopp)){ beloppEl.value = Number(r.belopp); fyllda.push('belopp'); }
      if(datumEl && !datumEl.value && r.forfallodatum && /^\d{4}-\d{2}-\d{2}$/.test(r.forfallodatum)){ datumEl.value = r.forfallodatum; fyllda.push('datum'); }
      if(r.typ === 'in' || r.typ === 'ut'){
        ekoForm.typ = r.typ;
        const inB = document.getElementById('ekoTypIn'), utB = document.getElementById('ekoTypUt');
        if(inB) inB.className = r.typ === 'in' ? 'vald-in' : '';
        if(utB) utB.className = r.typ === 'ut' ? 'vald-ut' : '';
      }
      setStatus(fyllda.length ? '✅ Avläst — kontrollera gärna uppgifterna.' : 'Hittade inga tydliga uppgifter — fyll i själv.');
    }catch(e){
      setStatus('Kunde inte läsa av just nu — fyll i själv.');
    }
  },

  async bilagaVisa(id){
    try{
      const res = await fetch(API + '?bilaga=' + encodeURIComponent(id), { headers: authHeaders() });
      if(!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      if(!data || !data.bilaga || !data.bilaga.data){ toast('Bilagan finns inte längre'); return; }
      if(String(data.bilaga.typ) === 'application/pdf'){
        /* pdf: öppna i egen flik via en blob-adress */
        const delar = String(data.bilaga.data).split(',');
        const bytes = atob(delar[1]);
        const arr = new Uint8Array(bytes.length);
        for(let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
        window.open(URL.createObjectURL(new Blob([arr], { type: 'application/pdf' })), '_blank');
      } else {
        visaBildOverlay(data.bilaga);
      }
    }catch(e){
      toast('Kunde inte hämta bilagan just nu');
    }
  },
  /* ---- prata med assistenten (förstasidan) ---- */
  async prataFilVald(input){
    const filer = Array.from(input.files || []);
    input.value = ''; /* så samma filer kan väljas igen senare */
    if(!filer.length) return;
    if(!session){ toast('Logga in först.'); return; }
    if(prataLaserFiler){ toast('Vänta — jag läser fortfarande in de förra filerna.'); return; }
    /* flera filer får följa med samma meddelande — med tak så det samlade
       anropet håller sig under serverns 4 MB-gräns. Gränserna hänger ihop:
       2 250 000 byte blir exakt 3 000 000 tecken base64, så en ensam PDF
       som klarar per fil-gränsen klarar alltid också totalgränsen. */
    const MAX_ANTAL = 5;
    const MAX_TOTALT = 3000000; /* tecken base64 sammanlagt */
    const MAX_PDF_BYTE = 2250000;
    /* inläsningen kan ta flera sekunder (kamerabilder komprimeras i flera
       steg) — flagga + ⏳-rad så inget skickas halvfärdigt, och de nya
       filerna läggs till i ETT svep först när alla är klara */
    prataLaserFiler = true;
    renderIdag();
    const nya = [];
    let forManga = 0, ejLasta = 0, fickEjPlats = 0, forStora = 0;
    try{
      for(const fil of filer){
        if(prataBifogade.length + nya.length >= MAX_ANTAL){ forManga++; continue; }
        const filtyp = fil.type || '';
        try{
          let ny = null;
          if(filtyp.startsWith('image/')){
            const dataUrl = await komprimeraBild(fil);
            if(!dataUrl){ ejLasta++; continue; }
            ny = {
              block: { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: dataUrl.split(',')[1] } },
              previewUrl: dataUrl,
              namn: fil.name || 'bild'
            };
          } else if(filtyp === 'application/pdf'){
            if(fil.size > MAX_PDF_BYTE){ forStora++; continue; }
            const dataUrl = await new Promise((res) => {
              const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => res(null); fr.readAsDataURL(fil);
            });
            if(!dataUrl){ ejLasta++; continue; }
            ny = {
              block: { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: dataUrl.split(',')[1] } },
              previewUrl: null,
              namn: fil.name || 'dokument'
            };
          } else {
            ejLasta++;
            continue;
          }
          const hittills = prataBifogade.concat(nya).reduce((s, b) => s + b.block.source.data.length, 0);
          if(hittills + ny.block.source.data.length > MAX_TOTALT){ fickEjPlats++; continue; }
          nya.push(ny);
        }catch(e){
          ejLasta++;
        }
      }
      prataBifogade = prataBifogade.concat(nya);
    }finally{
      prataLaserFiler = false;
      renderIdag();
    }
    /* ETT samlat besked om allt som inte kom med, så inget drunknar */
    const missar = [];
    if(forManga) missar.push(forManga + ' rymdes inte (högst ' + MAX_ANTAL + ' filer per meddelande)');
    if(forStora) missar.push(forStora + (forStora > 1 ? ' PDF:er var för stora' : ' PDF var för stor'));
    if(fickEjPlats) missar.push(fickEjPlats + ' fick inte plats (för stort tillsammans)');
    if(ejLasta) missar.push(ejLasta + ' kunde inte läsas');
    if(missar.length){
      toast((nya.length ? 'Vissa filer kom inte med: ' : 'Filerna kom inte med: ') + missar.join(', ') + '.');
    }
  },
  prataTaBortBifogad(i){
    prataBifogade.splice(i, 1);
    renderIdag();
  },
  async prataSkicka(viaRost, textOverride){
    /* textOverride: färdig text från t.ex. en briefkommentar — då lämnas
       skrivfältet orört och väntande chattbilagor följer INTE med */
    const overText = (textOverride === undefined || textOverride === null) ? null : String(textOverride).trim();
    const el = document.getElementById('prataInput');
    const text = overText !== null ? overText : ((el && el.value) || '').trim();
    const bifogade = overText === null ? prataBifogade : [];
    const lankar = Array.from(new Set(text.match(LANK_REGEX) || [])).slice(0, 2);
    if(prataLaserFiler){ toast('Ett ögonblick — filerna läses fortfarande in.'); return; }
    if(prataSkickar){ if(text || bifogade.length) toast('Vänta lite — jag skriver fortfarande på förra svaret.'); return; }
    if(!text && !bifogade.length) return;
    if(el && overText === null) el.value = '';
    /* text saknas bara om bilagor finns — se guarden ovan */
    const loggText = text || (bifogade.length > 1
      ? '📷 (bifogade ' + bifogade.length + ' filer)'
      : '📷 (bifogade en bild eller fil)');
    const meddelandeId = loggaMeddelande('prata', 'jag', loggText);
    const previews = bifogade.map(b => b.previewUrl).filter(Boolean);
    if(previews.length) prataBildPreviews[meddelandeId] = previews;
    if(overText === null) prataBifogade = [];
    prataSkickar = true;
    renderIdag();
    let lyckades = false; /* gick svaret fram? annars läggs bilagorna tillbaka */
    try{
      /* länkar Anna klistrat in läses av direkt — det sparar en runda.
         Vill modellen läsa MER (undersidor, källor) använder den verktyget
         oppna_lank i agent-rundorna nedan. */
      const lankResultat = [];
      for(const url of lankar){
        prataVisaStatus('📖 Läser ' + kortAdress(url) + '…');
        const innehall = await hamtaLankText(url);
        lankResultat.push({ url: url, innehall: innehall });
      }
      /* rejäl budget: modellen tänker i osynliga block som räknas mot
         max_tokens — för snålt tak ger ett TOMT svar på tunga frågor */
      const historik = kanalMeddelanden('prata').filter(m => m.id !== meddelandeId).slice(-15).map(m => ({
        role: m.roll === 'jag' ? 'user' : 'assistant',
        content: m.text
      }));
      const delar = [];
      for(const b of bifogade) delar.push(b.block);
      for(const l of lankResultat){
        delar.push({ type: 'text', text: l.innehall
          ? 'Innehåll från länken ' + l.url + ':\n"""' + l.innehall + '"""'
          : 'Länken ' + l.url + ' gick inte att öppna eller läsa av — säg det till Anna i stället för att gissa vad den innehåller.' });
      }
      let huvudText = text || (bifogade.length > 1 ? 'Vad ser du i de här bilderna/filerna?'
        : bifogade.length ? 'Vad ser du i den här bilden/filen?'
        : 'Titta på länken och berätta vad den handlar om.');
      const sistaContent = delar.length
        ? delar.concat([{ type: 'text', text: huvudText }])
        : loggText;

      /* ---- agent-rundorna: modellen väljer verktyg (öppna länk, sök,
         svara) tills den avslutar med svara. Sista rundan tvingas svara
         fram så Anna alltid får ett svar. ---- */
      const MAX_RUNDOR = 5;
      let meddelanden = historik.concat([{ role: 'user', content: sistaContent }]);
      let resultat = null;
      for(let runda = 0; runda < MAX_RUNDOR; runda++){
        prataVisaStatus(runda === 0 ? '' : 'funderar…');
        const { res, data } = await aiAnrop({ ai: {
          max_tokens: 4000,
          system: prataSystemPrompt(),
          tools: PRATA_VERKTYG,
          tool_choice: runda === MAX_RUNDOR - 1 ? { name: 'svara' } : undefined,
          messages: meddelanden
        } });
        if(res.status === 401){
          loggaMeddelande('prata', 'ass', 'Du verkar utloggad — logga in igen på Idag-fliken, så svarar jag som vanligt.');
          return;
        }
        if(res.status === 429){
          loggaMeddelande('prata', 'ass', (data && data.message) || 'Dagens AI-gräns är nådd — vi fortsätter imorgon.');
          return;
        }
        if(aiCreditSlut(data)){
          loggaMeddelande('prata', 'ass', 'AI-kontots kredit verkar slut — fyll på på console.anthropic.com, så svarar jag igen.');
          return;
        }
        if(!res.ok || !data) throw new Error('http ' + res.status);
        const anrop = Array.isArray(data.verktyg) ? data.verktyg : [];
        const svaraAnrop = anrop.find(v => v.name === 'svara');
        if(svaraAnrop && svaraAnrop.input){ resultat = svaraAnrop.input; break; }
        if(!anrop.length){
          /* inga verktygsanrop alls — falla tillbaka på texttolkning som förr */
          if(typeof data.text === 'string' && !data.text.trim()){
            loggaMeddelande('prata', 'ass', 'Jag tappade tråden mitt i svaret — ställ gärna frågan en gång till.');
            return;
          }
          resultat = tolkaJSONObjekt(data.text);
          if(!resultat || !resultat.svar){
            const raddat = raddaSvarUrText(data.text) || lasbarText(data.text);
            if(raddat) resultat = { svar: raddat };
          }
          break;
        }
        /* utför verktygen och spela tillbaka resultaten till nästa runda */
        meddelanden = meddelanden.concat([{
          role: 'assistant',
          content: anrop.map(v => ({ type: 'tool_use', id: v.id, name: v.name, input: v.input }))
        }]);
        const verktygsResultat = [];
        for(const v of anrop){
          let ut = 'Okänt verktyg.';
          if(v.name === 'oppna_lank' && v.input && v.input.url){
            prataVisaStatus('📖 Läser ' + kortAdress(v.input.url) + '…');
            ut = (await hamtaLankText(String(v.input.url))) ||
              'Sidan gick inte att öppna eller läsa av. Säg det till Anna — gissa inte vad den innehåller.';
          } else if(v.name === 'sok_webben' && v.input && v.input.fraga){
            prataVisaStatus('🔍 Söker på webben…');
            ut = await webbSok(String(v.input.fraga));
          }
          verktygsResultat.push({ type: 'tool_result', tool_use_id: v.id, content: String(ut).slice(0, 6000) });
        }
        meddelanden = meddelanden.concat([{ role: 'user', content: verktygsResultat }]);
      }
      if(!resultat || !resultat.svar){
        loggaMeddelande('prata', 'ass', 'Något gick fel — kan du försöka igen?');
        return;
      }
      /* bevakningar (nya) och matcha_texter (avbockade) är oberoende av
         varandra och kan båda finnas i samma svar — t.ex. en sammanslagning
         där gamla poster bockas av och en gemensam ny läggs in på en gång. */
      let extra = '';
      let andrat = false;
      const nyaLista = Array.isArray(resultat.bevakningar) ? resultat.bevakningar
        : (resultat.bevakning ? [resultat.bevakning] : []);
      if(nyaLista.length){
        let n = 0;
        for(const b of nyaLista){
          if(!b || !b.text) continue;
          state.poster.push({
            id: 'p' + Date.now() + Math.random().toString(36).slice(2, 6) + (n++),
            omrade: OMRADEN[b.omrade] ? b.omrade : 'hushall',
            text: String(b.text),
            datum: b.datum ? String(b.datum) : '',
            klar: false,
            skapad: new Date().toISOString()
          });
        }
        if(n) andrat = true;
      }
      const soklista = Array.isArray(resultat.matcha_texter) ? resultat.matcha_texter
        : (resultat.matcha_text ? [resultat.matcha_text] : []);
      if(soklista.length){
        let bockade = 0, missade = 0;
        for(const s of soklista){
          const sok = String(s || '').toLowerCase();
          if(!sok) continue;
          const match = state.poster.find(p => !p.klar && String(p.text).toLowerCase().includes(sok));
          if(match){ match.klar = true; match.klarNar = new Date().toISOString(); bockade++; }
          else missade++;
        }
        if(bockade) andrat = true;
        if(!bockade && missade) extra = ' (Jag hittade ingen bevakning som matchade, så inget bockades av.)';
      }
      /* ändringar av befintliga bevakningar: ny text och/eller nytt datum */
      const andringar = Array.isArray(resultat.andra_bevakningar) ? resultat.andra_bevakningar : [];
      for(const a of andringar){
        const sok = String((a && a.matcha) || '').toLowerCase();
        if(!sok) continue;
        const p = state.poster.find(p => !p.klar && String(p.text).toLowerCase().includes(sok));
        if(!p){ extra += ' (Jag hittade ingen bevakning att ändra som matchade.)'; continue; }
        if(a.ny_text) p.text = String(a.ny_text);
        if(a.nytt_datum !== undefined && a.nytt_datum !== null) p.datum = String(a.nytt_datum);
        andrat = true;
      }
      if(andrat){ save(); schedulePosterPush(); renderBevaka(); }
      /* ekonomiåtgärder direkt från chatten — samma hantering som
         ekonomichatten (App.ekoSkicka), men flera åtgärder i ett svar */
      const ekoLista = Array.isArray(resultat.ekonomi) ? resultat.ekonomi : [];
      let ekoAndrat = false;
      for(const e of ekoLista){
        if(!e || !e.action) continue;
        if(e.action === 'ny_post' && e.post && e.post.beskrivning && e.post.forfallodatum){
          const redan = e.post.redan_klar === true;
          const nyPost = {
            id: 'e' + Date.now() + Math.random().toString(36).slice(2, 5),
            typ: e.post.typ === 'in' ? 'in' : 'ut',
            beskrivning: String(e.post.beskrivning),
            belopp: Number(e.post.belopp) || 0,
            forfallodatum: String(e.post.forfallodatum),
            status: redan ? 'klar' : 'väntar'
          };
          if(redan) nyPost.klarNar = new Date().toISOString();
          state.ekonomiPoster.push(nyPost);
          ekoAndrat = true;
        } else if(e.action === 'uppdatera_saldo' && e.saldo && e.saldo.konto){
          const konto = String(e.saldo.konto).trim();
          const belopp = Number(e.saldo.belopp) || 0;
          const finns = state.ekonomiSaldon.find(s => s.konto.toLowerCase() === konto.toLowerCase());
          if(finns){ finns.belopp = belopp; finns.uppdaterad = fmtDate(todayDate()); }
          else state.ekonomiSaldon.push({ konto: konto, belopp: belopp, uppdaterad: fmtDate(todayDate()) });
          ekoAndrat = true;
        } else if(e.action === 'markera_klar' && e.matcha_beskrivning){
          const sok = String(e.matcha_beskrivning).toLowerCase();
          const match = ekoAktiva().find(p => String(p.beskrivning).toLowerCase().includes(sok));
          if(match){
            match.status = 'klar';
            match.klarNar = new Date().toISOString();
            if(match.bilaga){
              match.bilaga = false;
              fetch(API, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ radera_bilaga: match.id }) }).catch(() => {});
            }
            ekoAndrat = true;
          } else {
            extra += ' (Jag hittade ingen ekonomipost som matchade, så inget ändrades där.)';
          }
        }
      }
      if(ekoAndrat){ save(); scheduleEkonomiPush(); renderEkonomi(); }
      /* hälsonoteringar direkt ur samtalet — samma regler som knapparna på
         Hälsa-fliken: en vägning och en alkoholrad per dag, passen läggs på */
      const halsaLista = Array.isArray(resultat.halsa) ? resultat.halsa : [];
      let halsaAndrat = false;
      for(const p of halsaLista){
        if(!p || !p.action) continue;
        const datum = /^\d{4}-\d{2}-\d{2}$/.test(String(p.datum || '')) ? String(p.datum) : fmtDate(todayDate());
        if(p.action === 'vikt' && Number(p.kg) >= 20 && Number(p.kg) <= 300){
          const kg = Math.round(Number(p.kg) * 10) / 10;
          const finns = state.halsa.vikt.find(x => x.datum === datum);
          if(finns) finns.kg = kg; else state.halsa.vikt.push({ datum: datum, kg: kg });
          halsaAndrat = true;
        } else if(p.action === 'alkohol' && Number(p.glas) >= 0){
          const glas = Math.round(Number(p.glas));
          const finns = state.halsa.alkohol.find(a => a.datum === datum);
          if(finns){ finns.glas = glas; if(p.vad) finns.vad = String(p.vad); }
          else state.halsa.alkohol.push({ datum: datum, glas: glas, vad: p.vad ? String(p.vad) : '' });
          halsaAndrat = true;
        } else if(p.action === 'pass' && p.namn){
          state.halsa.pass.push({
            id: 'h' + Date.now() + Math.random().toString(36).slice(2, 5),
            datum: datum, namn: String(p.namn),
            typ: PASSTYPER[p.typ] ? p.typ : 'annat',
            minuter: Number(p.minuter) || null,
            loggat: new Date().toISOString()
          });
          halsaAndrat = true;
        }
      }
      if(halsaAndrat){ save(); scheduleHalsaPush(); renderHalsa(); }
      /* varaktig minnesanteckning → assistentens interna profil */
      if(resultat.anteckning && String(resultat.anteckning).trim()){
        state.data.profil = state.data.profil || {};
        state.data.profil.text = (((state.data.profil.text || '') + '\n' +
          String(resultat.anteckning).trim().slice(0, 400)).trim()).slice(-6000);
        state.data.profil.uppdaterad = new Date().toISOString();
        save();
        pushProfil();
      }
      loggaMeddelande('prata', 'ass', resultat.svar + extra);
      lyckades = true;
      if(viaRost) talUpp(resultat.svar);
    }catch(e){
      loggaMeddelande('prata', 'ass', 'Jag kom inte fram till kontoret just nu — försök igen om en stund.');
    }finally{
      /* gick det inte fram: lägg tillbaka bilagorna så "försök igen"
         faktiskt skickar med dem (utan att röra ev. nya som hunnit väljas) */
      if(!lyckades && bifogade.length) prataBifogade = bifogade.concat(prataBifogade);
      prataSkickar = false;
      prataStatus = '';
      renderIdag();
      if(!viaRost && overText === null){
        const nyEl = document.getElementById('prataInput');
        if(nyEl) nyEl.focus();
      }
    }
  },
  rostLyssna(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ toast('Röstinmatning stöds inte i den här webbläsaren'); return; }
    if(rostAktiv){
      try{ rostIgang.stop(); }catch(e){}
      return;
    }
    /* liten tyst utterance i klickögonblicket låser upp uppläsning på iPhone */
    if(KAN_TALA){ try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){} }
    const r = new SR();
    rostIgang = r;
    r.lang = 'sv-SE';
    r.interimResults = false;
    r.maxAlternatives = 1;
    r.onresult = (e) => {
      const text = e.results[0] && e.results[0][0] ? e.results[0][0].transcript : '';
      if(!text) return;
      const el = document.getElementById('prataInput');
      if(el) el.value = text;
      App.prataSkicka(true);
    };
    r.onerror = (e) => {
      if(e.error === 'not-allowed') toast('Ge webbläsaren lov att använda mikrofonen');
      else if(e.error !== 'aborted') toast('Jag hörde inte riktigt — försök igen');
    };
    r.onend = () => {
      rostAktiv = false;
      const b = document.getElementById('prataMik');
      if(b) b.classList.remove('lyssnar');
    };
    try{
      r.start();
      rostAktiv = true;
      const b = document.getElementById('prataMik');
      if(b) b.classList.add('lyssnar');
    }catch(e){ rostAktiv = false; }
  },

  intervjuStart(typ){

    const iv = (state.data && state.data.intervjuer) || {};
    const sparadeSvar = (iv[typ] && iv[typ].svar) || {};
    intervju = { typ: typ, index: 0, svar: Object.assign({}, sparadeSvar), laege: 'fraga', utkast: null, sammanfattar: false };
    renderIntervju();
    App.go('intervju');
