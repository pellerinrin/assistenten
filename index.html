<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistenten</title>
<meta name="description" content="Din stillsamma sekreterare — morgonbrief, bevakningar och koll på vardagen.">
<meta name="theme-color" content="#f7f3ea">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Assistenten">
<style>
:root{
  --paper:#f7f3ea; --card:#fffdf7; --ink:#2e2a24; --ink-soft:#6f675c; --ink-dim:#9a9084;
  --line:#e4dccb; --line-soft:#eee7d8;
  --green:#37503f; --bronze:#a8834b; --terra:#b56c4e; --blue:#6b7fa3; --red:#a03d2e;
  --shadow:0 1px 3px rgba(60,50,30,.07);
}
*{box-sizing:border-box; margin:0; padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--paper); color:var(--ink); font-size:15.5px; line-height:1.5;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif; font-weight:600}
button{font-family:inherit}

/* ---- topp ---- */
.top{
  max-width:560px; margin:0 auto; padding:20px 18px 6px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
}
.top h1{font-size:24px; letter-spacing:.02em}
.top h1 .penna{font-size:19px; margin-left:2px}
.topdate{color:var(--ink-soft); font-size:13.5px; font-style:italic; font-family:Georgia,serif}
.refresh{
  border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
  width:38px; height:38px; border-radius:50%; font-size:17px; cursor:pointer; flex:none;
}
.refresh:active{transform:rotate(180deg); transition:transform .3s}
.refresh.snurr{animation:snurr 1s linear infinite}
@keyframes snurr{to{transform:rotate(360deg)}}

main{max-width:560px; margin:0 auto; padding:10px 14px 24px}
.view{display:none}
.view.open{display:block}

/* ---- kort ---- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:16px 16px 14px; margin-bottom:14px; box-shadow:var(--shadow);
}
.card h2{font-size:16.5px; margin-bottom:8px}
.small{font-size:13.5px}
.muted{color:var(--ink-soft)}
.dim{color:var(--ink-dim)}
.center{text-align:center}
.mono{font-variant-numeric:tabular-nums}

/* ---- brief ---- */
.brief{border-color:#d8cba9; background:linear-gradient(180deg,#fffdf5,#fbf6e8)}
.brief .halsning{
  font-family:Georgia,serif; font-size:16.5px; font-style:italic; color:var(--ink);
  margin:2px 0 12px; line-height:1.55;
}
.brief-punkt{display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--line-soft)}
.brief-punkt .bp-emoji{flex:none; font-size:17px; line-height:1.4}
.brief-punkt .bp-rubrik{font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:1px}
.brief-sign{margin-top:12px; text-align:right; font-family:Georgia,serif; font-style:italic; color:var(--ink-dim); font-size:13.5px}

/* ---- rader ---- */
.rad{display:flex; gap:10px; align-items:baseline; padding:8px 0; border-top:1px solid var(--line-soft); font-size:14.5px}
.rad:first-of-type{border-top:none}
.rad .r-emoji{flex:none; width:24px; text-align:center}
.rad .r-text{flex:1}
.rad .r-nar{flex:none; font-size:12.5px; color:var(--ink-dim); font-style:italic}
.rad .r-nar.sen{color:var(--red); font-weight:600; font-style:normal}
.rad .r-nar.idag{color:var(--green); font-weight:600; font-style:normal}

/* ---- bevakningar ---- */
.omr-rubrik{display:flex; align-items:center; gap:8px; margin:4px 0 6px}
.omr-rubrik .streck{flex:1; height:1px; background:var(--line)}
.omr-rubrik h3{font-size:14px; letter-spacing:.05em; color:var(--ink-soft); text-transform:uppercase; font-weight:600}
.post{display:flex; gap:10px; align-items:flex-start; padding:9px 2px; border-top:1px solid var(--line-soft)}
.post:first-of-type{border-top:none}
.post input[type=checkbox]{width:19px; height:19px; margin-top:2px; accent-color:var(--green); flex:none}
.post .p-text{flex:1}
.post .p-datum{font-size:12.5px; color:var(--ink-dim); font-style:italic}
.post .p-datum.sen{color:var(--red); font-weight:600; font-style:normal}
.post.klar .p-text{text-decoration:line-through; color:var(--ink-dim)}
.post .p-bort{border:none; background:none; color:var(--ink-dim); font-size:15px; cursor:pointer; padding:2px 6px}
.post .p-bort:hover{color:var(--red)}

.ny-form{display:flex; flex-direction:column; gap:8px}
.ny-form input[type=text]{width:100%}
.ny-rad2{display:flex; gap:8px; flex-wrap:wrap}
input[type=text],input[type=date],input[type=number],select,textarea{
  border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:15px;
  background:#fff; color:var(--ink); font-family:inherit;
}
textarea{width:100%; min-height:200px; line-height:1.55; resize:vertical}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--bronze)}
.ny-rad2 select{flex:1; min-width:130px}

/* ---- mejl ---- */
.mejl-item{padding:10px 0; border-top:1px solid var(--line-soft)}
.mejl-item:first-of-type{border-top:none}
.mejl-item .m-amne{font-weight:600}
.mejl-item .m-fran{font-size:12.5px; color:var(--ink-dim)}
.mejl-item .m-sammanfattning{font-size:14px; color:var(--ink-soft); margin-top:2px}

/* ---- ekonomi ---- */
.eko-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px}
.eko-summa{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 11px; box-shadow:var(--shadow)}
.eko-summa .es-etikett{font-size:11.5px; color:var(--ink-soft); margin-bottom:2px}
.eko-summa .es-belopp{font-family:Georgia,serif; font-weight:600; font-size:15.5px; white-space:nowrap}
.card.akut{background:var(--terra); border-color:var(--terra); color:#fff}
.card.akut h2{color:#fff}
.eko-post{display:flex; gap:10px; align-items:center; padding:9px 2px; border-top:1px solid var(--line-soft)}
.eko-post:first-of-type{border-top:none}
.eko-post .ep-text{flex:1; min-width:0; font-size:14.5px}
.eko-post .ep-belopp{font-family:Georgia,serif; font-weight:600; white-space:nowrap; font-size:14.5px}
.eko-post .ep-klar{border:1px solid var(--green); background:none; color:var(--green); border-radius:8px; width:30px; height:30px; cursor:pointer; flex:none; font-size:15px}
.typvalj{display:flex; gap:8px}
.typvalj button{flex:1; border-radius:10px; padding:8px; font-size:14px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink-soft)}
.typvalj button.vald-in{border-color:var(--blue); background:var(--blue); color:#fff}
.typvalj button.vald-ut{border-color:var(--terra); background:var(--terra); color:#fff}
.ep-bilaga{border:1px solid var(--line); background:#fff; color:var(--ink-soft); border-radius:8px; width:30px; height:30px; cursor:pointer; flex:none; font-size:14px}
.eko-post.arkiv .ep-text{color:var(--ink-dim)}
.eko-post.arkiv .ep-belopp{color:var(--ink-dim) !important}
.bild-overlay{position:fixed; inset:0; background:rgba(46,42,36,.85); z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px}
.bild-overlay img{max-width:96vw; max-height:80vh; border-radius:10px; background:#fff}
.bild-overlay .namn{color:#f7f3ea; font-size:13px; margin-top:10px}
.chatt{display:flex; flex-direction:column; gap:8px; max-height:320px; overflow-y:auto; padding:4px 0; margin:8px 0}
.bubbla{max-width:82%; border-radius:12px; padding:8px 12px; font-size:14.5px; line-height:1.45}
.bubbla.jag{align-self:flex-end; background:var(--green); color:#fdfbf4}
.bubbla.ass{align-self:flex-start; background:var(--paper); border:1px solid var(--line)}
.chatt-form{display:flex; gap:8px}
.chatt-form input{flex:1; min-width:0}
.mik{
  border:1px solid var(--line); background:#fff; color:var(--ink); width:44px; flex:none;
  border-radius:11px; font-size:17px; cursor:pointer;
}
.mik.lyssnar{border-color:var(--red); background:var(--red); color:#fff; animation:puls 1.2s ease-in-out infinite}
@keyframes puls{50%{opacity:.55}}
.las-upp{border:none; background:none; cursor:pointer; font-size:13px; padding:0 2px; opacity:.7}
.las-upp:hover{opacity:1}

/* ---- knappar ---- */
.btn{
  border:1px solid var(--green); background:var(--green); color:#fdfbf4;
  border-radius:11px; padding:9px 16px; font-size:14.5px; cursor:pointer;
}
.btn.ghost{background:transparent; color:var(--green)}
.btn.small{padding:6px 12px; font-size:13.5px}
.btn.danger{border-color:var(--red); background:transparent; color:var(--red)}
.btn:active{transform:translateY(1px)}
.knapprad{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}

.inline-form{display:flex; gap:8px; margin-top:8px}
.inline-form input{flex:1; min-width:0; text-transform:uppercase; letter-spacing:.08em}

/* ---- flikar ---- */
.tabs{
  position:fixed; bottom:0; left:0; right:0; z-index:5;
  background:var(--card); border-top:1px solid var(--line);
  display:flex; justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabs button{
  border:none; background:none; color:var(--ink-dim); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:1px;
  font-size:19px; padding:4px 14px; border-radius:10px;
}
.tabs button span{font-size:11px; letter-spacing:.02em}
.tabs button.aktiv{color:var(--green); background:#eef0e6}

/* ---- toast ---- */
#toast{
  position:fixed; left:50%; bottom:calc(86px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(8px);
  background:var(--ink); color:#f7f3ea; border-radius:12px; padding:9px 16px; font-size:14px;
  opacity:0; pointer-events:none; transition:.25s; max-width:88vw; text-align:center; z-index:9;
}
#toast.show{opacity:1; transform:translateX(-50%)}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Assistenten <span class="penna">🖋</span></h1>
    <p class="topdate" id="topDate"></p>
  </div>
  <button class="refresh" id="refreshBtn" onclick="hamta(true)" title="Hämta nytt" aria-label="Hämta nytt">↻</button>
</header>

<main>
  <div id="view-idag" class="view"></div>
  <div id="view-bevaka" class="view"></div>
  <div id="view-ekonomi" class="view"></div>
  <div id="view-mejl" class="view"></div>
  <div id="view-mer" class="view"></div>
  <div id="view-intervju" class="view"></div>
</main>

<nav class="tabs">
  <button id="tab-idag" onclick="App.go('idag')">☕<span>Idag</span></button>
  <button id="tab-bevaka" onclick="App.go('bevaka')">🗒️<span>Bevaka</span></button>
  <button id="tab-ekonomi" onclick="App.go('ekonomi')">💰<span>Ekonomi</span></button>
  <button id="tab-mejl" onclick="App.go('mejl')">✉️<span>Mejl</span></button>
  <button id="tab-mer" onclick="App.go('mer')">⚙️<span>Mer</span></button>
</nav>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';

/* ================= Datum & småhjälp ================= */
const WDAYS = ['måndag','tisdag','onsdag','torsdag','fredag','lördag','söndag'];
const MONTHS = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseDate(s){ const p=String(s).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function todayDate(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function addDays(d,n){ const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()); t.setDate(t.getDate()+n); return t; }
function wIdx(d){ return (d.getDay()+6)%7; } /* 0 = måndag, samma som Vardagskoll */
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function humanDate(d){ return WDAYS[wIdx(d)]+' '+d.getDate()+' '+MONTHS[d.getMonth()]; }
function isoWeek(d){
  const t = addDays(d, 3 - wIdx(d));
  const jan4 = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round((t - addDays(jan4, -wIdx(jan4))) / (7*24*3600*1000));
}
/* dagar från idag till datumsträngen (negativt = passerat) */
function dagarTill(ds){ return Math.round((parseDate(ds) - todayDate()) / (24*3600*1000)); }
function narText(ds){
  const n = dagarTill(ds);
  if(n < 0) return { text: (n === -1 ? 'igår' : Math.abs(n)+' dagar sedan'), klass: 'sen' };
  if(n === 0) return { text: 'idag', klass: 'idag' };
  if(n === 1) return { text: 'imorgon', klass: '' };
  if(n < 7) return { text: 'på '+WDAYS[wIdx(parseDate(ds))], klass: '' };
  const d = parseDate(ds);
  return { text: d.getDate()+' '+MONTHS[d.getMonth()], klass: '' };
}
function formatKr(n){ return new Intl.NumberFormat('sv-SE').format(Number(n) || 0) + ' kr'; }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ================= Livsområden ================= */
const OMRADEN = {
  barn:    { namn: 'Barnen',            emoji: '🧸' },
  karriar: { namn: 'Karriär',           emoji: '✒️' },
  hushall: { namn: 'Hushåll & ekonomi', emoji: '🏡' },
  halsa:   { namn: 'Hälsa & privat',    emoji: '🌿' },
};

/* ================= Konto: ett gemensamt medlemskap ================= */
/* Samma Supabase-konto som Skrivbordet — logga in med samma e-post och
   lösenord. Vardagskoll och Assistenten ligger på samma GitHub Pages-
   ursprung, så en inloggning här räcker automatiskt även där. */
const SUPABASE_URL = 'https://sqhpkzkkveqvkqmohzpc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_s02x24M_xX4MHdqcU7ncYQ_T9ctHXKZ';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null; /* null = utloggad (eller inte klar ännu) */
let authFel = '';
let authMsg = '';
function accessToken(){ return session && session.access_token; }
function authHeaders(extra){
  const h = Object.assign({ 'Content-Type': 'application/json' }, extra || {});
  if(accessToken()) h.Authorization = 'Bearer ' + accessToken();
  return h;
}

/* ================= State ================= */
const LS_KEY = 'assistenten-v1';
const API = 'https://skrivbordet.vercel.app/api/assistent';

let state = {
  data: {},          /* senaste svar från API:t: brief, poster, mejl, vardagskoll, jobbresor, skrivbordet */
  dataTid: 0,
  poster: [],        /* lokal spegel av bevakningarna (source of truth är kontot) */
  posterDirty: false,
  ekonomiPoster: [], /* lokal spegel av ekonomiposterna (in/ut med förfallodatum) */
  ekonomiSaldon: [], /* kända kontosaldon: [{konto, belopp, uppdaterad}] */
  ekonomiDirty: false,
  notified: {},
  visaKlara: false,
  samtal: [],        /* samtalslogg från kontot (servern är source of truth) */
  utkorg: [],        /* samtalsrader som ännu inte kvitterats av servern */
};

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){ /* börja om från tomt */ }
}
function save(){
  try{
    /* hela historiken bor på kontot — lokalt räcker de senaste raderna */
    if(state.samtal.length > 600) state.samtal = state.samtal.slice(-600);
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  }
  catch(e){ toast('⚠️ Kunde inte spara lokalt'); }
}

/* ================= Hämta & skicka ================= */
let hamtaLast = 0;

async function hamta(force){
  if(!session){ renderAll(); return; }
  const now = Date.now();
  if(!force && now - hamtaLast < 3 * 60 * 1000) return;
  hamtaLast = now;
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('snurr');
  try{
    /* osparade bevakningar/ekonomiposter/samtal åker upp först, så inget skrivs över */
    if(state.posterDirty) await pushPoster();
    if(state.ekonomiDirty) await pushEkonomi();
    if(state.utkorg.length) await pushLogg();
    const res = await fetch(API, { headers: authHeaders() });
    if(res.status === 401){
      toast('⚠️ Du är utloggad — logga in igen på Idag-fliken');
      return;
    }
    if(!res.ok) throw new Error('http ' + res.status);
    state.data = await res.json() || {};
    state.dataTid = Date.now();
    if(!state.posterDirty) state.poster = Array.isArray(state.data.poster) ? state.data.poster : [];
    if(!state.ekonomiDirty){
      state.ekonomiPoster = Array.isArray(state.data.ekonomiPoster) ? state.data.ekonomiPoster : [];
      state.ekonomiSaldon = Array.isArray(state.data.ekonomiSaldon) ? state.data.ekonomiSaldon : [];
    }
    if(Array.isArray(state.data.samtal)){
      state.samtal = state.data.samtal;
      delete state.data.samtal; /* ligger i state.samtal — ingen dubbellagring */
    }
    save();
    renderAll();
    checkNotiser();
  }catch(e){
    /* offline eller serverfel: senast hämtade datat visas vidare */
    if(force) toast('Kunde inte nå kontoret just nu – visar det senaste jag vet');
  }finally{
    btn.classList.remove('snurr');
  }
}

let posterTimer = null;
function schedulePosterPush(){
  state.posterDirty = true;
  save();
  clearTimeout(posterTimer);
  posterTimer = setTimeout(pushPoster, 1200);
}
async function pushPoster(){
  if(!session) return;
  try{
    const res = await fetch(API, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ skriv: { 'assistent-poster': state.poster } })
    });
    if(!res.ok) throw new Error('http ' + res.status);
    state.posterDirty = false;
    save();
  }catch(e){
    /* försök igen vid nästa hämtning */
  }
}

/* ---- samtalsloggen: allt som sägs mellan Anna och assistenten sparas på
   kontot och försvinner aldrig (utom när Anna själv raderar det under Mer).
   Nya rader väntar i utkorgen tills servern kvitterat dem, så inget tappas
   även om nätet strular mitt i ett samtal. ---- */
let loggTimer = null;
function loggaMeddelande(kanal, roll, text){
  state.utkorg.push({
    id: 'm' + Date.now() + Math.random().toString(36).slice(2, 7),
    t: new Date().toISOString(),
    roll: roll,
    kanal: kanal,
    text: String(text)
  });
  save();
  clearTimeout(loggTimer);
  loggTimer = setTimeout(pushLogg, 800);
}
function kanalMeddelanden(kanal){
  return state.samtal.filter(m => m.kanal === kanal)
    .concat(state.utkorg.filter(m => m.kanal === kanal))
    .sort((a, b) => String(a.t).localeCompare(String(b.t)));
}
async function pushLogg(){
  if(!session || !state.utkorg.length) return;
  const batch = state.utkorg.slice(0, 100);
  try{
    const res = await fetch(API, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ logga: batch })
    });
    if(!res.ok) throw new Error('http ' + res.status);
    const data = await res.json().catch(() => null);
    const sparade = new Set((data && data.sparade) || batch.map(m => m.id));
    state.samtal = state.samtal.concat(state.utkorg.filter(m => sparade.has(m.id)));
    state.utkorg = state.utkorg.filter(m => !sparade.has(m.id));
    save();
    if(state.utkorg.length){ clearTimeout(loggTimer); loggTimer = setTimeout(pushLogg, 800); }
  }catch(e){
    /* raderna ligger kvar i utkorgen och skickas om vid nästa försök */
  }
}

let ekonomiTimer = null;
function scheduleEkonomiPush(){
  state.ekonomiDirty = true;
  save();
  clearTimeout(ekonomiTimer);
  ekonomiTimer = setTimeout(pushEkonomi, 1200);
}
async function pushEkonomi(){
  if(!session) return;
  try{
    const res = await fetch(API, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ skriv: {
        'assistent-ekonomi-poster': state.ekonomiPoster,
        'assistent-ekonomi-saldon': state.ekonomiSaldon
      } })
    });
    if(!res.ok) throw new Error('http ' + res.status);
    state.ekonomiDirty = false;
    save();
  }catch(e){

  }
}

/* ================= Notiser (medan appen är öppen) ================= */
function notiserPa(){ return ('Notification' in window) && Notification.permission === 'granted'; }
function fireNotis(title, body, key){
  try{ new Notification(title, { body: body, icon: 'icon-192.png', tag: key }); }catch(e){}
}
function checkNotiser(){
  if(!notiserPa()) return;
  const ts = fmtDate(todayDate());
  let changed = false;
  function once(key, fn){
    if(state.notified[key]) return;
    fn();
    state.notified[key] = ts;
    changed = true;
  }
  /* morgonbriefen har kommit */
  const b = state.data.brief;
  if(b && b.datum === ts) once('b-' + b.datum, () =>
    fireNotis('Assistenten ☕', 'Morgonbriefen är klar – slå dig ner en stund.', 'b-' + b.datum));
  /* bevakningar med datum: imorgon och på dagen */
  for(const p of state.poster){
    if(p.klar || !p.datum) continue;
    const n = dagarTill(p.datum);
    if(n === 1) once('p-' + p.id + '-1', () => fireNotis('Assistenten 🗒️', 'Imorgon: ' + p.text, 'p-' + p.id));
    if(n === 0) once('p-' + p.id + '-0', () => fireNotis('Assistenten 🗒️', 'Idag: ' + p.text, 'p-' + p.id));
  }
  /* ekonomiposter som förfaller imorgon eller idag */
  for(const p of state.ekonomiPoster){
    if(!p.forfallodatum) continue;
    const n = dagarTill(p.forfallodatum);
    const vad = (p.typ === 'in' ? 'Fakturera ' : 'Betala ') + p.beskrivning + ' (' + formatKr(p.belopp) + ')';
    if(n === 1) once('e-' + p.id + '-1', () => fireNotis('Assistenten 💰', 'Imorgon: ' + vad, 'e-' + p.id));
    if(n === 0) once('e-' + p.id + '-0', () => fireNotis('Assistenten 💰', 'Idag: ' + vad, 'e-' + p.id));
  }
  /* datum som assistenten hittat i mejlen */
  const fynd = (state.data.mejl && state.data.mejl.datumfynd) || [];
  for(const f of fynd){
    if(!f.datum) continue;
    const n = dagarTill(f.datum);
    if(n === 1) once('d-' + f.datum + '-' + String(f.text).slice(0, 24), () =>
      fireNotis('Assistenten ✉️', 'Imorgon: ' + f.text, 'd-' + f.datum));
  }
  /* städa gamla nycklar */
  const limit = fmtDate(addDays(todayDate(), -14));
  for(const k of Object.keys(state.notified)){
    if(state.notified[k] < limit){ delete state.notified[k]; changed = true; }
  }
  if(changed) save();
}

  const resor = Array.isArray(d.jobbresor) ? d.jobbresor : [];

  }

  /* ---- att hålla ögonen på ---- */
  const bevakning = [];
  for(const p of state.poster){
    if(p.klar || !p.datum) continue;
    if(dagarTill(p.datum) <= 10) bevakning.push({ datum: p.datum, emoji: OMRADEN[p.omrade] ? OMRADEN[p.omrade].emoji : '🗒️', text: esc(p.text) });

  for(const p of ekoAktiva()){
    if(!p.forfallodatum || dagarTill(p.forfallodatum) > 10) continue;
    bevakning.push({ datum: p.forfallodatum, emoji: '💰',
      text: esc((p.typ === 'in' ? 'Fakturera: ' : 'Betala: ') + p.beskrivning + ' — ' + formatKr(p.belopp)) });

  if(bevakning.length){
    html += '<div class="card"><h2>Att hålla ögonen på</h2>';
    for(const r of bevakning) html += radHtml(r.emoji, r.text, narText(r.datum));

/* Chatten på förstasidan. Hålls i minnet (nollställs när appen laddas om);
   AI-anropen går via /api/assistent som håller nyckeln på servern och
   räknar mot kontots dagliga AI-tak. */
const KAN_LYSSNA = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
const KAN_TALA = 'speechSynthesis' in window;

const HALSNING_PRATA = 'Hej! Fråga mig om dagen — barnen, mejlen, pengarna, skrivandet — eller be mig komma ihåg något åt dig.';
let visaHelaHistoriken = false;

let rostAktiv = false;
let rostIgang = null;

/* svensk röst för uppläsning (listan laddas ibland i efterhand) */
let rostSv = null;
function valjRost(){
  const alla = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  rostSv = alla.find(v => v.lang === 'sv-SE') || alla.find(v => String(v.lang || '').toLowerCase().startsWith('sv')) || null;
}
if(KAN_TALA){
  valjRost();
  speechSynthesis.onvoiceschanged = valjRost;
}
function talUpp(text){
  if(!KAN_TALA || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'sv-SE';
    if(!rostSv) valjRost();
    if(rostSv) u.voice = rostSv;
    speechSynthesis.speak(u);
  }catch(e){ /* uppläsning är grädde på moset — aldrig ett fel värt att visa */ }
}

let intervjuSvarTimer = null;
function scheduleIntervjuSvarPush(){
  clearTimeout(intervjuSvarTimer);
  intervjuSvarTimer = setTimeout(pushIntervjuSvar, 900);
}
async function pushIntervjuSvar(){
  if(!session || !intervju) return;
  const typ = intervju.typ;
  const iv = Object.assign({}, (state.data && state.data.intervjuer) || {});
  const befintlig = iv[typ] || {};
  iv[typ] = Object.assign({}, befintlig, { svar: intervju.svar, uppdaterad: new Date().toISOString() });
  try{
    const res = await fetch(API, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ skriv: { 'assistent-intervjuer': iv } })
    });
    if(!res.ok) throw new Error('http ' + res.status);
    state.data.intervjuer = iv;
    save();
  }catch(e){
    /* försök igen om en liten stund */
    clearTimeout(intervjuSvarTimer);
    intervjuSvarTimer = setTimeout(pushIntervjuSvar, 4000);
  }
}

/* ---- fakturabilagor: bilden komprimeras i webbläsaren och sparas på
   kontot som en egen nyckel; den raderas när posten bockas av ---- */
function komprimeraBild(fil){
  return new Promise((resolve) => {
    const url = URL.createObjectURL(fil);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const forsok = [[1500, 0.8], [1500, 0.6], [1100, 0.55], [900, 0.45]];
      for(const [maxSida, kvalitet] of forsok){
        const skala = Math.min(1, maxSida / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * skala);
        c.height = Math.round(img.height * skala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const dataUrl = c.toDataURL('image/jpeg', kvalitet);
        if(dataUrl.length <= 340000){ resolve(dataUrl); return; }
      }
      resolve(null);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
async function laddaUppBilaga(postId, fil){
  const typ = fil.type || '';
  let dataUrl = null;
  if(typ.startsWith('image/')){
    dataUrl = await komprimeraBild(fil);
    if(!dataUrl){ toast('Bilden gick inte att förminska — försök fota rakare och närmare'); return false; }
  } else if(typ === 'application/pdf'){
    if(fil.size > 250000){ toast('PDF:en är för stor — fota fakturan i stället 📷'); return false; }
    dataUrl = await new Promise((res) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => res(null);
      fr.readAsDataURL(fil);
    });
    if(!dataUrl){ toast('Kunde inte läsa filen'); return false; }
  } else {
    toast('Bara bilder och PDF går att spara');
    return false;
  }
  try{
    const res = await fetch(API, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ skriv: { ['assistent-bilaga-' + postId]: {
        namn: fil.name || 'faktura', typ: typ.startsWith('image/') ? 'image/jpeg' : typ,
        data: dataUrl, uppladdad: new Date().toISOString()
      } } })
    });
    if(!res.ok) throw new Error('http ' + res.status);
    const p = state.ekonomiPoster.find(x => x.id === postId);
    if(p){ p.bilaga = true; save(); scheduleEkonomiPush(); }
    renderEkonomi();
    toast('🧾 Fakturan är sparad');
    return true;
  }catch(e){
    toast('Kunde inte spara bilden just nu — försök igen om en stund');
    return false;
  }
}

/* Tolkar exakt ett JSON-objekt ur AI-svaret, djup/strängmedveten. */
function tolkaJSONObjekt(text){
  if(!text) return null;
  const t = String(text).replace(/```json/gi, '').replace(/```/g, '');
  let depth = 0, start = -1, inStr = false, escd = false;
  for(let i = 0; i < t.length; i++){
    const ch = t[i];
    if(inStr){
      if(escd) escd = false;
      else if(ch === '\\') escd = true;
      else if(ch === '"') inStr = false;
      continue;
    }
    if(ch === '"') inStr = true;
    else if(ch === '{'){
      if(depth === 0) start = i;
      depth++;
    } else if(ch === '}'){
      depth--;
      if(depth === 0 && start !== -1){
        try{ return JSON.parse(t.slice(start, i + 1)); }
        catch(e){ start = -1; }
      }
    }
  }
  return null;
}

function renderMejl(){
  const m = (state.data && state.data.mejl) || null;
  let html = '';
  if(!m){
    html = '<div class="card"><h2>✉️ Mejlöversikt</h2>' +
      '<p class="small muted">Här sammanfattar jag din inkorg varje morgon: vad som är viktigt, vad som väntar på svar och vilka datum som gömmer sig i mejlen. Första översikten dyker upp efter nästa morgonbrief.</p></div>';
  } else {
    html = '<div class="card"><p class="small dim">Senast genomgången ' +
      esc(m.uppdaterad ? new Date(m.uppdaterad).toLocaleString('sv-SE', { weekday: 'long', hour: '2-digit', minute: '2-digit' }) : '–') + '</p></div>';

    const viktiga = m.viktiga || [];
    html += '<div class="card"><h2>Viktigt just nu</h2>';
    if(viktiga.length){
      for(const v of viktiga){
        html += '<div class="mejl-item"><div class="m-amne">' + esc(v.amne || '(utan ämne)') + '</div>' +
          '<div class="m-fran">' + esc(v.fran || '') + '</div>' +
          (v.sammanfattning ? '<div class="m-sammanfattning">' + esc(v.sammanfattning) + '</div>' : '') +
          '</div>';
      }
    } else {
      html += '<p class="small muted">Inget som kräver något av dig just nu.</p>';
    }
    html += '</div>';

    const obesvarade = m.obesvarade || [];
    if(obesvarade.length){
      html += '<div class="card"><h2>Väntar på svar från dig</h2>';
      for(const o of obesvarade){
        html += '<div class="mejl-item"><div class="m-amne">' + esc(o.amne || '(utan ämne)') + '</div>' +
          '<div class="m-fran">' + esc(o.fran || '') + (o.dagar ? ' · ' + o.dagar + (o.dagar === 1 ? ' dag' : ' dagar') + ' utan svar' : '') + '</div>' +
          '</div>';
      }
      html += '</div>';
    }

    const fynd = m.datumfynd || [];
    if(fynd.length){
      html += '<div class="card"><h2>Datum jag hittat i mejlen</h2>';
      for(const f of fynd.slice().sort((a,b) => String(a.datum).localeCompare(String(b.datum)))){
        if(f.datum && dagarTill(f.datum) < -1) continue;
        html += radHtml('📅', esc(f.text || ''), f.datum ? narText(f.datum) : null);
      }
      html += '</div>';
    }
  }
  document.getElementById('view-mejl').innerHTML = html;
}

  nyPost(){

    schedulePosterPush();
    renderBevaka();
    renderIdag();
  },
  bortPost(id){
    state.poster = state.poster.filter(x => x.id !== id);
    save();
    schedulePosterPush();
    renderBevaka();
    renderIdag();
  },
  toggleKlara(){
    state.visaKlara = !state.visaKlara;
    save();
    renderBevaka();
  },
  rensaKlara(){

    renderBevaka();
    toast('Avklarade bevakningar rensade');

    document.getElementById('ekoTypIn').className = typ === 'in' ? 'vald-in' : '';

  },

    const datum = document.getElementById('ekoDatum').value || '';
    const filEl = document.getElementById('ekoFil');

    const id = 'e' + Date.now() + Math.random().toString(36).slice(2, 5);

    });

  ekoKlar(id){
    const p = state.ekonomiPoster.find(x => x.id === id);

    /* posten arkiveras för alltid — bara fakturabilden städas bort */
    p.status = 'klar';
    p.klarNar = new Date().toISOString();

      }).catch(() => {});

    scheduleEkonomiPush();
    renderEkonomi();

    renderEkonomi();
  },
  bilagaValj(id){
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*,application/pdf';
    inp.onchange = () => { if(inp.files && inp.files[0]) laddaUppBilaga(id, inp.files[0]); };
    inp.click();
  },
  async bilagaVisa(id){
    try{
      const res = await fetch(API + '?bilaga=' + encodeURIComponent(id), { headers: authHeaders() });
      if(!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      if(!data || !data.bilaga || !data.bilaga.data){ toast('Bilagan finns inte längre'); return; }
      if(String(data.bilaga.typ) === 'application/pdf'){
        /* pdf: öppna i egen flik via en blob-adress */
        const delar = String(data.bilaga.data).split(',');
        const bytes = atob(delar[1]);
        const arr = new Uint8Array(bytes.length);
        for(let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
        window.open(URL.createObjectURL(new Blob([arr], { type: 'application/pdf' })), '_blank');
      } else {
        visaBildOverlay(data.bilaga);
      }
    }catch(e){
      toast('Kunde inte hämta bilagan just nu');
    }
  },
  /* ---- prata med assistenten (förstasidan) ---- */
  async prataSkicka(viaRost){
    const el = document.getElementById('prataInput');
    const text = ((el && el.value) || '').trim();
    if(!text || prataSkickar) return;
    if(el) el.value = '';
    loggaMeddelande('prata', 'jag', text);
    prataSkickar = true;
    renderIdag();
    try{
      const res = await fetch(API, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ ai: {
          system: prataSystemPrompt(),
          messages: kanalMeddelanden('prata').slice(-16).map(m => ({
            role: m.roll === 'jag' ? 'user' : 'assistant',
            content: m.text
          }))
        } })
      });
      const data = await res.json().catch(() => null);
      if(res.status === 429){
        loggaMeddelande('prata', 'ass', (data && data.message) || 'Dagens AI-gräns är nådd — vi fortsätter imorgon.');
        return;
      }
      if(!res.ok || !data || !data.text) throw new Error('http ' + res.status);
      const resultat = tolkaJSONObjekt(data.text);
      if(!resultat || !resultat.svar){
        loggaMeddelande('prata', 'ass', 'Något gick fel — kan du försöka igen?');
        return;
      }
      let extra = '';
      if(resultat.action === 'ny_bevakning' && resultat.bevakning && resultat.bevakning.text){
        state.poster.push({
          id: 'p' + Date.now() + Math.random().toString(36).slice(2, 5),
          omrade: OMRADEN[resultat.bevakning.omrade] ? resultat.bevakning.omrade : 'hushall',
          text: String(resultat.bevakning.text),
          datum: resultat.bevakning.datum ? String(resultat.bevakning.datum) : '',
          klar: false,
          skapad: new Date().toISOString()
        });
        save(); schedulePosterPush(); renderBevaka();
      } else if(resultat.action === 'klar_bevakning' && resultat.matcha_text){
        const sok = String(resultat.matcha_text).toLowerCase();
        const match = state.poster.find(p => !p.klar && String(p.text).toLowerCase().includes(sok));
        if(match){
          match.klar = true;
          match.klarNar = new Date().toISOString();
          save(); schedulePosterPush(); renderBevaka();
        } else {
          extra = ' (Jag hittade ingen bevakning som matchade, så inget bockades av.)';
        }
      }
      loggaMeddelande('prata', 'ass', resultat.svar + extra);
      if(viaRost) talUpp(resultat.svar);
    }catch(e){
      loggaMeddelande('prata', 'ass', 'Jag kom inte fram till kontoret just nu — försök igen om en stund.');
    }finally{
      prataSkickar = false;
      renderIdag();
      if(!viaRost){
        const nyEl = document.getElementById('prataInput');
        if(nyEl) nyEl.focus();
      }
    }
  },
  rostLyssna(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ toast('Röstinmatning stöds inte i den här webbläsaren'); return; }
    if(rostAktiv){
      try{ rostIgang.stop(); }catch(e){}
      return;
    }
    /* liten tyst utterance i klickögonblicket låser upp uppläsning på iPhone */
    if(KAN_TALA){ try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){} }
    const r = new SR();
    rostIgang = r;
    r.lang = 'sv-SE';
    r.interimResults = false;
    r.maxAlternatives = 1;
    r.onresult = (e) => {
      const text = e.results[0] && e.results[0][0] ? e.results[0][0].transcript : '';
      if(!text) return;
      const el = document.getElementById('prataInput');
      if(el) el.value = text;
      App.prataSkicka(true);
    };
    r.onerror = (e) => {
      if(e.error === 'not-allowed') toast('Ge webbläsaren lov att använda mikrofonen');
      else if(e.error !== 'aborted') toast('Jag hörde inte riktigt — försök igen');
    };
    r.onend = () => {
      rostAktiv = false;
      const b = document.getElementById('prataMik');
      if(b) b.classList.remove('lyssnar');
    };
    try{
      r.start();
      rostAktiv = true;
      const b = document.getElementById('prataMik');
      if(b) b.classList.add('lyssnar');
    }catch(e){ rostAktiv = false; }
  },
  lasUpp(id){
    const m = state.samtal.find(x => x.id === id) || state.utkorg.find(x => x.id === id);
    if(m) talUpp(m.text);
  },

  /* ---- lär känna mig: intervjuerna ---- */
  intervjuStart(typ){
    if(!session){ toast('Logga in på Idag-fliken först'); return; }
    const iv = (state.data && state.data.intervjuer) || {};
    const sparadeSvar = (iv[typ] && iv[typ].svar) || {};

  intervjuTillbaka(){

    if(!intervju) return;
    intervju.svar[el.dataset.fid] = el.value;
    scheduleIntervjuSvarPush();
  },
  async intervjuSammanfatta(){
    if(!intervju || intervju.sammanfattar) return;
    const ihopsamlat = INTERVJUER[intervju.typ].fragor
      .map(f => ({ fraga: f.text, svar: (intervju.svar[f.id] || '').trim() }))
      .filter(x => x.svar);
    if(!ihopsamlat.length){ toast('Fyll i minst en fråga innan jag sammanfattar'); return; }
    intervju.sammanfattar = true;
    renderIntervju();
    try{
      const profil = state.data && state.data.profil && state.data.profil.text;
      const system = 'Du är Annas personliga assistent — en stillsam, varm och kunnig sekreterare.\n' +
        'Ämne: ' + INTERVJUER[intervju.typ].beskrivning + '.\n' +
        (profil ? '\nDina egna anteckningar om Anna (håll dem för dig själv):\n' + profil + '\n' : '') +
        '\nHär är Annas svar på ett antal frågor om ämnet:\n' + JSON.stringify(ihopsamlat) + '\n\n' +
        'Skriv ett utlåtande TILL dig själv (assistenten) om Anna, 120–250 ord på svenska, i tredje person, sakligt och varmt — det ska hjälpa dig stötta henne rätt i vardagen. Bygg bara på det hon faktiskt skrivit, hitta inget på. Svara ENBART med utlåtandets text, ingen rubrik, inga citattecken.';
      const res = await fetch(API, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ ai: { system: system, max_tokens: 500, messages: [{ role: 'user', content: 'Skriv utlåtandet.' }] } })
      });
      const data = await res.json().catch(() => null);
      if(res.status === 429){
        toast((data && data.message) || 'Dagens AI-gräns är nådd — försök igen imorgon.');
        return;
      }
      if(!res.ok || !data || !data.text) throw new Error('http ' + res.status);
      intervju.utkast = data.text.trim();
      toast('Utkast klart — läs igenom och spara om det stämmer 🖋');
    }catch(e){
      toast('Kunde inte sammanfatta just nu — försök igen om en stund');
    }finally{
      intervju.sammanfattar = false;
      renderIntervju();
    }

  async intervjuSpara(){
    const el = document.getElementById('utlText');
    const text = ((el && el.value) || '').trim();

    const iv = Object.assign({}, (state.data && state.data.intervjuer) || {});
    const befintlig = iv[intervju.typ] || {};
    iv[intervju.typ] = Object.assign({}, befintlig, { utlatande: text, svar: intervju.svar, uppdaterad: new Date().toISOString() });
    try{
      const res = await fetch(API, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ skriv: { 'assistent-intervjuer': iv } })
      });
      if(!res.ok) throw new Error('http ' + res.status);
      state.data.intervjuer = iv;

      toast('Utlåtandet är sparat — assistenten rättar sig efter det 🖋');

      });
      const data = await res.json().catch(() => null);
      if(res.status === 429){
        loggaMeddelande('ekonomi', 'ass', (data && data.message) || 'Dagens AI-gräns är nådd — vi fortsätter imorgon.');
        return;
      }
      if(!res.ok || !data || !data.text) throw new Error('http ' + res.status);
      const resultat = tolkaJSONObjekt(data.text);
      if(!resultat || !resultat.svar){
        loggaMeddelande('ekonomi', 'ass', 'Något gick fel — kan du försöka igen?');
        return;
      }
      let extra = '';
      if(resultat.action === 'ny_post' && resultat.post && resultat.post.beskrivning && resultat.post.forfallodatum){
        state.ekonomiPoster.push({
          id: 'e' + Date.now() + Math.random().toString(36).slice(2, 5),
          typ: resultat.post.typ === 'in' ? 'in' : 'ut',
          beskrivning: String(resultat.post.beskrivning),
          belopp: Number(resultat.post.belopp) || 0,
          forfallodatum: String(resultat.post.forfallodatum),
          status: 'väntar'
        });
        save(); scheduleEkonomiPush();
      } else if(resultat.action === 'uppdatera_saldo' && resultat.saldo && resultat.saldo.konto){
        const konto = String(resultat.saldo.konto).trim();
        const belopp = Number(resultat.saldo.belopp) || 0;
        const uppdaterad = fmtDate(todayDate());
        const finns = state.ekonomiSaldon.find(s => s.konto.toLowerCase() === konto.toLowerCase());
        if(finns){ finns.belopp = belopp; finns.uppdaterad = uppdaterad; }
        else state.ekonomiSaldon.push({ konto: konto, belopp: belopp, uppdaterad: uppdaterad });
        save(); scheduleEkonomiPush();
      } else if(resultat.action === 'markera_klar' && resultat.matcha_beskrivning){
        const sok = String(resultat.matcha_beskrivning).toLowerCase();
        const match = ekoAktiva().find(p => String(p.beskrivning).toLowerCase().includes(sok));
        if(match){
          /* arkivera för alltid — bara fakturabilden städas bort */
          match.status = 'klar';
          match.klarNar = new Date().toISOString();
          if(match.bilaga){
            match.bilaga = false;
            fetch(API, {
              method: 'POST',
              headers: authHeaders(),
              body: JSON.stringify({ radera_bilaga: match.id })
            }).catch(() => {});
          }
          save(); scheduleEkonomiPush();
        } else {
          extra = ' (Jag hittade ingen post som matchade, så inget ändrades.)';
        }
      }
      loggaMeddelande('ekonomi', 'ass', resultat.svar + extra);
    }catch(e){
      loggaMeddelande('ekonomi', 'ass', 'Något gick fel — kan du försöka igen?');
    }finally{
      ekonomiSkickar = false;
      renderEkonomi();
      renderIdag();
      const inp = document.getElementById('ekoChatInput');
      if(inp) inp.focus();
    }
  },

  async loggaIn(){
    const emailEl = document.getElementById('authEmail');
    const passEl = document.getElementById('authPass');
    const email = ((emailEl && emailEl.value) || '').trim();
    const pass = (passEl && passEl.value) || '';
    if(!email || !pass){ authFel = 'Fyll i både e-post och lösenord.'; authMsg = ''; renderAll(); return; }
    authFel = ''; authMsg = 'Loggar in…';
    renderAll();
    const { error } = await sb.auth.signInWithPassword({ email: email, password: pass });
    if(error){ authFel = error.message; authMsg = ''; renderAll(); return; }
    /* onAuthStateChange tar över och hämtar uppgifterna */
  },
  async registrera(){
    const emailEl = document.getElementById('authEmail');
    const passEl = document.getElementById('authPass');
    const email = ((emailEl && emailEl.value) || '').trim();
    const pass = (passEl && passEl.value) || '';
    if(!email || !pass || pass.length < 6){ authFel = 'E-post och ett lösenord (minst 6 tecken).'; authMsg = ''; renderAll(); return; }
    authFel = ''; authMsg = 'Skapar konto…';
    renderAll();
    const { error } = await sb.auth.signUp({ email: email, password: pass });
    if(error){ authFel = error.message; authMsg = ''; renderAll(); return; }
    authFel = '';
    authMsg = 'Kolla din mejl för att bekräfta kontot — logga sedan in.';
    renderAll();
  },
  async loggaUt(){
    await sb.auth.signOut();
    state.data = {};
    state.dataTid = 0;
    save();
    /* onAuthStateChange nollställer session och ritar om */
  },

  notiserPa(){
    Notification.requestPermission().then(p => {
      renderMer();
      if(p === 'granted'){
        toast('Notiser är på 🔔');
        checkNotiser();
      }
    });
  },

  nollstall(){
    if(!confirm('Nollställa appen på den här enheten? Bevakningarna finns kvar på ditt konto.')) return;
    localStorage.removeItem(LS_KEY);
    location.reload();
  },
};

/* ================= Igångsättning ================= */
load();
renderAll();
App.go('idag');

sb.auth.getSession().then(({ data }) => {
  session = data.session || null;
  renderAll();
  if(session) hamta(true);
});
sb.auth.onAuthStateChange((_event, sess) => {
  const varInloggad = !!session;
  session = sess || null;
  authFel = ''; authMsg = '';
  renderAll();
  if(session && !varInloggad) hamta(true);
  if(!session) App.go('idag');
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

setInterval(() => {
  hamta();
  checkNotiser();
  /* nytt dygn: rita om datumraden och vyerna */
  const ts = fmtDate(todayDate());
  if(App._dag !== ts){ App._dag = ts; renderAll(); }
}, 60000);

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') hamta(true);
});
</script>
</body>
</html>
